                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Icon(
                          imageVector = if (isEditing) Icons.Default.Edit else Icons.Default.Schedule,
                          contentDescription = null,
                          tint = if (isEditing) palette.newFolderAccent else palette.secondaryText,
                          modifier = Modifier.size(20.dp)
                      )
                      Spacer(Modifier.width(12.dp))
                      Text(
                          text = title,
                          fontSize = 16.sp,
                          fontWeight = FontWeight.Medium,
