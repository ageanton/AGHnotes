                                              pL.startsWith("• ") -> { val nT = inc.text.substring(0, iI+1) + "• " + inc.text.substring(iI+1); val nD = adjustDocumentOnEdit(d, nT, aB, aI); val nS = TextRange(iI+3); d = nD; tfv = TextFieldValue(nT, nS); tIS(nD, selection=nS, forceNewUndoStep=true); return@BasicTextField }
                                              pL.startsWith("☐ ") || pL.startsWith("☑ ") -> { val nT = inc.text.substring(0, iI+1) + "☐ " + inc.text.substring(iI+1); val nD = adjustDocumentOnEdit(d, nT, aB, aI); val nS = TextRange(iI+3); d = nD; tfv = TextFieldValue(nT, nS); tIS(nD, selection=nS, forceNewUndoStep=true); return@BasicTextField }
