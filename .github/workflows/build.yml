              <path android:fillColor="#FAF9F5" android:pathData="M31,24h36l10,10v50c0,2.2 -1.8,4 -4,4H31c-2.2,0 -4,-1.8 -4,-4V28c0,-2.2 1.8,-4 4,-4z"/>
              <path android:fillColor="#E6E4DD" android:pathData="M67,24v10h10z"/>
              <path android:fillColor="#191918" android:pathData="M36,42h24v3.2h-24zM36,51h18v3.2h-18z"/>
              <path android:fillColor="#2563EB" android:pathData="M36,68 C42,61 48,73 56,64 C60,60 64,62 68,58 L70,61 C65,65 61,64 57,68 C48,77 42,65 36,72 Z"/>
              <path android:fillColor="#D97706" android:pathData="M62,56 L77,41 L82,46 L67,61 Z"/>
              <path android:fillColor="#191918" android:pathData="M59,64 L62,56 L67,61 Z"/>
