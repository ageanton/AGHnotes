          EOF_KOTLIN
          sed -i 's/^          //' app/src/main/java/com/local/monolith/MainActivity.kt

      - name: Ensure Valid Persistent Release Keystore
        run: |
          mkdir -p app
          if ! keytool -list -keystore app/keystore.jks -storepass monolithPass2026 -alias monolith_key >/dev/null 2>&1; then
            echo "Generating clean PKCS12 release keystore..."
            rm -f app/keystore.jks
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore app/keystore.jks \
              -alias monolith_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass monolithPass2026 \
              -keypass monolithPass2026 \
              -dname "CN=MonolithVault, OU=Mobile, O=MonolithLocal, L=Local, S=Local, C=IN"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/keystore.jks
            git commit -m "chore: persist valid PKCS12 android release keystore [skip ci]" || true
            git push || true
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK & Play Store Bundle
        run: |
          gradle assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk Folio-Notes-Release.apk
          cp app/build/outputs/bundle/release/app-release.aab Folio-Notes-PlayStore.aab

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Notes-Android-Release
          path: |
            Folio-Notes-Release.apk
            Folio-Notes-PlayStore.aab
