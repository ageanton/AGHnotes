          @Composable
          fun NotesApp(db: NotesDatabase, prefs: SharedPreferences, isDarkTheme: Boolean, onToggleDarkTheme: (Boolean) -> Unit, fontScaleIndex: Int, onSelectFontScale: (Int) -> Unit, baseFontSizeSp: Float) {
              val scope = rememberCoroutineScope(); val snackbarHostState = remember { SnackbarHostState() }
              var notes by remember { mutableStateOf(db.getAllNotes(false)) }; var customFolders by remember { mutableStateOf(loadSavedFolders(prefs)) }
              var currentFolderPath by remember { mutableStateOf("") }; var activeNoteId by remember { mutableStateOf<String?>(null) }
              var searchQuery by remember { mutableStateOf("") }
              val sessionUndoMap = remember { mutableMapOf<String, SessionUndoQueue>() }
              
              var noteToRename by remember { mutableStateOf<Note?>(null) }; var noteToMoveFolder by remember { mutableStateOf<Note?>(null) }
              var showNewFolderDialog by remember { mutableStateOf(false) }; var folderToRename by remember { mutableStateOf<String?>(null) }
              var folderToDelete by remember { mutableStateOf<String?>(null) }; var showSettingsDialog by remember { mutableStateOf(false) }
              var showTrashBin by remember { mutableStateOf(false) }

              val allFolders = remember(customFolders, notes) { expandAllFolderPaths(customFolders + notes.map { normalizeFolderPath(it.folder) }.filter { it.isNotEmpty() }) }
              fun refreshNotes() { notes = db.getAllNotes(false) }

              fun handleDeleteWithUndo(target: Note) {
                  db.upsertNote(target.copy(isTrashed = true, updatedAt = System.currentTimeMillis()))
                  if (activeNoteId == target.id) activeNoteId = null
                  refreshNotes()
                  scope.launch {
                      snackbarHostState.currentSnackbarData?.dismiss()
                      val res = snackbarHostState.showSnackbar("Moved to trash", "Undo", duration = SnackbarDuration.Short)
                      if (res == SnackbarResult.ActionPerformed) { db.upsertNote(target.copy(isTrashed = false)); refreshNotes() }
                  }
              }

              val activeNote = remember(notes, activeNoteId) { activeNoteId?.let { id -> notes.firstOrNull { it.id == id } } }

              Scaffold(snackbarHost = { SnackbarHost(snackbarHostState) { data -> Snackbar(data, shape = RoundedCornerShape(10.dp), containerColor = MaterialTheme.colorScheme.onBackground, contentColor = MaterialTheme.colorScheme.background, actionColor = MaterialTheme.colorScheme.background) } }, containerColor = MaterialTheme.colorScheme.background) { rootPadding ->
                  Box(Modifier.fillMaxSize().padding(rootPadding)) {
                      if (showTrashBin) {
                          TrashBinScreen(db, onBack = { showTrashBin = false; refreshNotes() })
                      } else if (activeNote != null) {
                          val undoQueue = remember(activeNote.id) { sessionUndoMap.getOrPut(activeNote.id) { SessionUndoQueue(EditorSnapshot(activeNote.title, activeNote.document, TextRange(activeNote.document.text.length))) } }
                          NoteEditorScreen(activeNote, undoQueue, baseFontSizeSp, allFolders.isNotEmpty(), { db.upsertNote(it); refreshNotes() }, { refreshNotes(); activeNoteId = null }, { db.upsertNote(it.copy(isPinned = !it.isPinned, updatedAt = System.currentTimeMillis())); refreshNotes() }, { noteToRename = it }, { noteToMoveFolder = it }, { handleDeleteWithUndo(it) })
                      } else {
                          NotesHomeScreen(notes, allFolders, currentFolderPath, { currentFolderPath = normalizeFolderPath(it) }, { folderToRename = it }, { folderToDelete = it }, searchQuery, { searchQuery = it }, { activeNoteId = it.id }, { db.upsertNote(Note(title="", document=RichNoteDocument(), folder=currentFolderPath).also{activeNoteId=it.id}); refreshNotes() }, { showNewFolderDialog = true }, { db.upsertNote(it.copy(isPinned = !it.isPinned, updatedAt = System.currentTimeMillis())); refreshNotes() }, { noteToRename = it }, { noteToMoveFolder = it }, { handleDeleteWithUndo(it) }, { showSettingsDialog = true })
                      }
                  }
              }

              if (showNewFolderDialog) NewFolderDialog(currentFolderPath, { showNewFolderDialog = false }) { rawName ->
                  val clean = rawName.trim().replace("/", "-")
                  if (clean.isNotEmpty()) { val fp = if (currentFolderPath.isEmpty()) clean else "$currentFolderPath/$clean"; customFolders = expandAllFolderPaths(customFolders + fp); saveFoldersList(prefs, customFolders) }
                  showNewFolderDialog = false
              }
              if (folderToRename != null) RenameFolderDialog(folderDisplayName(folderToRename!!), { folderToRename = null }) { rawName ->
                  val clean = rawName.trim().replace("/", "-")
                  if (clean.isNotEmpty()) {
                      val parent = parentFolderPath(folderToRename!!); val newPath = if (parent.isEmpty()) clean else "$parent/$clean"
                      customFolders = expandAllFolderPaths(customFolders.map { if (it.equals(folderToRename, true)) newPath else if (it.startsWith("$folderToRename/", true)) newPath + it.substring(folderToRename!!.length) else it } + newPath)
                      saveFoldersList(prefs, customFolders); db.renameFolderTree(folderToRename!!, newPath)
                      if (currentFolderPath.equals(folderToRename, true)) currentFolderPath = newPath else if (currentFolderPath.startsWith("$folderToRename/", true)) currentFolderPath = newPath + currentFolderPath.substring(folderToRename!!.length)
                      refreshNotes()
                  }
                  folderToRename = null
              }
              if (folderToDelete != null) DeleteFolderDialog(folderDisplayName(folderToDelete!!), { folderToDelete = null }) {
                  customFolders = customFolders.filterNot { it.equals(folderToDelete, true) || it.startsWith("$folderToDelete/", true) }
                  saveFoldersList(prefs, customFolders); db.removeFolderTreeMoveNotesToParent(folderToDelete!!)
                  if (currentFolderPath.equals(folderToDelete, true) || currentFolderPath.startsWith("$folderToDelete/", true)) currentFolderPath = parentFolderPath(folderToDelete!!)
                  refreshNotes(); folderToDelete = null
              }
              if (noteToMoveFolder != null) MoveToFolderDialog(noteToMoveFolder!!.folder, allFolders, { noteToMoveFolder = null }, { db.upsertNote(noteToMoveFolder!!.copy(folder = normalizeFolderPath(it), updatedAt = System.currentTimeMillis())); refreshNotes(); noteToMoveFolder = null }, { noteToMoveFolder = null; showNewFolderDialog = true })
              if (noteToRename != null) RenameNoteDialog(noteToRename!!.title, { noteToRename = null }) { db.upsertNote(noteToRename!!.copy(title = it.trim(), updatedAt = System.currentTimeMillis())); refreshNotes(); noteToRename = null }
              if (showSettingsDialog) SettingsDialog(isDarkTheme, onToggleDarkTheme, fontScaleIndex, onSelectFontScale, { showSettingsDialog = false; showTrashBin = true }, { showSettingsDialog = false })
          }

