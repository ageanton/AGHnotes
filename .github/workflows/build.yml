          </vector>
          EOF_ICON_FG
          sed -i 's/^          //' app/src/main/res/drawable/ic_launcher_foreground.xml

          cat << 'EOF_MIPMAP' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
