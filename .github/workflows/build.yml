              onCreateNewFolder: () -> Unit
          ) {
              val palette = LocalFolioPalette.current
              AlertDialog(
                  onDismissRequest = onDismiss,
                  shape = RoundedCornerShape(18.dp),
                  containerColor = palette.surface,
