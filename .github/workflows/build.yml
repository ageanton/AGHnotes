          // ============================================================================
          // 30-DAY TRASH SCREEN
          // ============================================================================

          @Composable
          fun TrashScreen(
              trashedNotes: List<Note>,
              onBack: () -> Unit,
              onRestoreNote: (Note) -> Unit,
              onDeleteForever: (Note) -> Unit,
              onEmptyTrash: () -> Unit
          ) {
              val palette = LocalFolioPalette.current
              var confirmEmptyTrash by remember { mutableStateOf(false) }

              BackHandler { onBack() }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(palette.screenBg)
                      .padding(horizontal = 20.dp)
              ) {
                  Spacer(Modifier.windowInsetsTopHeight(WindowInsets.statusBars))
                  Spacer(Modifier.height(16.dp))

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          IconButton(
                              onClick = onBack,
                              modifier = Modifier.size(44.dp)
                          ) {
                              Icon(
                                  imageVector = Icons.AutoMirrored.Filled.ArrowBack,
                                  contentDescription = "Back",
                                  tint = palette.primaryText
                              )
                          }
                          Spacer(Modifier.width(4.dp))
                          Text(
                              text = "Trash",
                              fontSize = 28.sp,
                              fontWeight = FontWeight.Bold,
                              color = palette.primaryText
                          )
                      }

                      if (trashedNotes.isNotEmpty()) {
                          TextButton(onClick = { confirmEmptyTrash = true }) {
                              Text(
                                  text = "Empty trash",
                                  color = MaterialTheme.colorScheme.error,
                                  fontWeight = FontWeight.SemiBold
                              )
                          }
                      }
                  }

                  Spacer(Modifier.height(6.dp))

                  Text(
                      text = "Notes in Trash are automatically deleted after 30 days.",
                      fontSize = 13.sp,
                      color = palette.secondaryText
                  )

                  Spacer(Modifier.height(16.dp))

                  if (trashedNotes.isEmpty()) {
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .weight(1f),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(
                              text = "Trash is empty",
                              fontSize = 15.sp,
                              color = palette.secondaryText
                          )
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier
                              .fillMaxWidth()
                              .weight(1f),
                          contentPadding = PaddingValues(bottom = 48.dp)
                      ) {
                          item {
                              Column(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clip(RoundedCornerShape(20.dp))
                                      .background(palette.surface, RoundedCornerShape(20.dp))
                                      .border(1.dp, palette.cardBorder, RoundedCornerShape(20.dp))
                              ) {
                                  trashedNotes.forEachIndexed { idx, note ->
                                      val daysLeft = note.daysRemainingInTrash()
                                      Row(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .padding(horizontal = 18.dp, vertical = 16.dp),
                                          verticalAlignment = Alignment.Top,
                                          horizontalArrangement = Arrangement.SpaceBetween
                                      ) {
                                          Column(
                                              modifier = Modifier
                                                  .weight(1f)
                                                  .padding(end = 12.dp)
                                          ) {
                                              Text(
                                                  text = note.title.ifBlank { "Untitled" },
                                                  fontSize = 17.sp,
                                                  fontWeight = FontWeight.SemiBold,
                                                  color = palette.primaryText,
                                                  maxLines = 1,
                                                  overflow = TextOverflow.Ellipsis
                                              )
                                              Spacer(Modifier.height(4.dp))
                                              Text(
                                                  text = note.previewText.ifBlank { "No additional text" },
                                                  fontSize = 15.sp,
                                                  lineHeight = 21.sp,
                                                  color = palette.previewText,
                                                  maxLines = 2,
                                                  overflow = TextOverflow.Ellipsis
                                              )
                                              Spacer(Modifier.height(6.dp))
                                              Text(
                                                  text = if (daysLeft == 1) "Deletes in 1 day" else "Deletes in $daysLeft days",
                                                  fontSize = 13.sp,
                                                  color = palette.secondaryText
                                              )
                                          }

                                          Row(verticalAlignment = Alignment.CenterVertically) {
                                              TextButton(onClick = { onRestoreNote(note) }) {
                                                  Text("Restore", fontWeight = FontWeight.SemiBold, color = palette.newFolderAccent)
                                              }
                                              IconButton(onClick = { onDeleteForever(note) }) {
                                                  Icon(
                                                      imageVector = Icons.Default.Delete,
                                                      contentDescription = "Delete forever",
                                                      tint = MaterialTheme.colorScheme.error,
                                                      modifier = Modifier.size(20.dp)
                                                  )
                                              }
                                          }
                                      }
                                      if (idx < trashedNotes.lastIndex) {
                                          HorizontalDivider(
                                              modifier = Modifier.fillMaxWidth(),
                                              thickness = 1.dp,
                                              color = palette.rowDivider
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              if (confirmEmptyTrash) {
                  AlertDialog(
                      onDismissRequest = { confirmEmptyTrash = false },
                      shape = RoundedCornerShape(18.dp),
                      containerColor = palette.surface,
                      title = { Text("Empty trash?", fontSize = 18.sp, fontWeight = FontWeight.SemiBold) },
                      text = {
                          Text(
                              text = "All notes in Trash will be permanently deleted. This cannot be undone.",
                              fontSize = 15.sp,
                              color = palette.secondaryText
                          )
                      },
                      confirmButton = {
                          TextButton(
                              onClick = {
                                  confirmEmptyTrash = false
                                  onEmptyTrash()
                              }
                          ) {
                              Text("Empty trash", color = MaterialTheme.colorScheme.error, fontWeight = FontWeight.SemiBold)
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { confirmEmptyTrash = false }) { Text("Cancel") }
                      }
                  )
              }
          }

          // ============================================================================
          // NOTE EDITOR SCREEN (FIND IN NOTE + KEEP-STYLE REMINDERS + FIXED SCROLL)
          // ============================================================================

          @Composable
          fun NoteEditorScreen(
              note: Note,
              prefs: SharedPreferences,
              undoQueue: SessionUndoQueue,
              baseFontSizeSp: Float,
              hasFolders: Boolean,
              onAutoSave: (Note) -> Unit,
              onBack: () -> Unit,
              onTogglePin: (Note) -> Unit,
              onRequestRename: (Note) -> Unit,
              onRequestMoveFolder: (Note) -> Unit,
              onRequestDelete: (Note) -> Unit
          ) {
              val context = LocalContext.current
              val palette = LocalFolioPalette.current
              val clipboardManager = LocalClipboardManager.current
              val focusManager = LocalFocusManager.current
              val density = LocalDensity.current.density

              val scrollState = rememberScrollState()
              var scrollViewportHeightPx by remember { mutableStateOf(0) }
              var bodyTopOffsetInContentPx by remember { mutableStateOf(0) }
              var latestTextLayout by remember { mutableStateOf<TextLayoutResult?>(null) }

              var title by remember(note.id) { mutableStateOf(note.title) }
              var doc by remember(note.id) { mutableStateOf(note.document) }
              var textFieldValue by remember(note.id) {
                  mutableStateOf(
                      TextFieldValue(
                          text = note.document.text,
                          selection = TextRange(note.document.text.length)
                      )
                  )
              }

              LaunchedEffect(note.title) {
                  if (note.title != title) title = note.title
              }

              // Track only actual text edits (never trigger downward scroll on selection handles or middle taps!)
              var lastEditedTextLength by remember(note.id) { mutableStateOf(note.document.text.length) }

              LaunchedEffect(textFieldValue.text) {
                  val newLen = textFieldValue.text.length
                  if (newLen == lastEditedTextLength) return@LaunchedEffect
                  lastEditedTextLength = newLen

                  val layout = latestTextLayout ?: return@LaunchedEffect
                  if (!textFieldValue.selection.collapsed || scrollViewportHeightPx <= 0) return@LaunchedEffect

                  val cursorOffset = textFieldValue.selection.end.coerceIn(0, layout.layoutInput.text.length)
                  val cursorRect = runCatching { layout.getCursorRect(cursorOffset) }.getOrNull() ?: return@LaunchedEffect

                  val cursorTopInScroll = bodyTopOffsetInContentPx + cursorRect.top
                  val cursorBottomInScroll = bodyTopOffsetInContentPx + cursorRect.bottom
                  val visibleTop = scrollState.value.toFloat()
                  val visibleBottom = (scrollState.value + scrollViewportHeightPx).toFloat()
                  val bottomMarginPx = 64f * density
                  val topMarginPx = 28f * density

                  if (cursorBottomInScroll + bottomMarginPx > visibleBottom) {
                      val target = (cursorBottomInScroll + bottomMarginPx - scrollViewportHeightPx).roundToInt()
                      scrollState.scrollTo(target.coerceIn(0, scrollState.maxValue))
                  } else if (cursorTopInScroll - topMarginPx < visibleTop) {
                      val target = (cursorTopInScroll - topMarginPx).roundToInt()
                      scrollState.scrollTo(target.coerceIn(0, scrollState.maxValue))
                  }
              }

              // Continuous edge auto-scroll during long text selection drag so copying large text is effortless
              var selectionDragFingerYInViewport by remember { mutableStateOf<Float?>(null) }
              LaunchedEffect(selectionDragFingerYInViewport, textFieldValue.selection) {
                  while (selectionDragFingerYInViewport != null && !textFieldValue.selection.collapsed && scrollViewportHeightPx > 0) {
                      val y = selectionDragFingerYInViewport ?: break
                      val edgeZonePx = 76f * density
                      val maxStepPx = 26f * density
                      val delta = when {
                          y < edgeZonePx -> -((edgeZonePx - y) / edgeZonePx * maxStepPx).roundToInt().coerceAtLeast(4)
                          y > scrollViewportHeightPx - edgeZonePx ->
                              ((y - (scrollViewportHeightPx - edgeZonePx)) / edgeZonePx * maxStepPx).roundToInt().coerceAtLeast(4)
                          else -> 0
                      }
                      if (delta != 0) {
                          scrollState.scrollTo((scrollState.value + delta).coerceIn(0, scrollState.maxValue))
                      }
                      delay(16L)
                  }
              }

              // Find-in-Note search state
              var isFindInNoteVisible by remember { mutableStateOf(false) }
              var findQuery by remember { mutableStateOf("") }
              var activeMatchIdx by remember { mutableStateOf(0) }

              val findMatches = remember(textFieldValue.text, findQuery, isFindInNoteVisible) {
                  if (!isFindInNoteVisible || findQuery.isBlank()) {
                      emptyList()
                  } else {
                      val list = mutableListOf<IntRange>()
                      val hay = textFieldValue.text.lowercase()
                      val needle = findQuery.lowercase()
                      var startIdx = 0
                      while (startIdx <= hay.length - needle.length) {
                          val found = hay.indexOf(needle, startIdx)
                          if (found == -1) break
                          list.add(found until (found + needle.length))
                          startIdx = found + needle.length.coerceAtLeast(1)
                      }
                      list
                  }
              }

              LaunchedEffect(findMatches.size) {
                  if (findMatches.isEmpty()) {
                      activeMatchIdx = 0
                  } else if (activeMatchIdx >= findMatches.size) {
                      activeMatchIdx = 0
                  }
              }

              // Scroll smoothly to the active Find-in-Note match
              LaunchedEffect(activeMatchIdx, findMatches, latestTextLayout) {
                  if (!isFindInNoteVisible || findMatches.isEmpty()) return@LaunchedEffect
                  val layout = latestTextLayout ?: return@LaunchedEffect
                  val range = findMatches[activeMatchIdx.coerceIn(0, findMatches.lastIndex)]
                  val matchRect = runCatching {
                      layout.getCursorRect(range.first.coerceIn(0, layout.layoutInput.text.length))
                  }.getOrNull() ?: return@LaunchedEffect
                  val matchCenterInScroll = bodyTopOffsetInContentPx + matchRect.top - (scrollViewportHeightPx * 0.35f)
                  scrollState.animateScrollTo(matchCenterInScroll.roundToInt().coerceIn(0, scrollState.maxValue))
              }

              var showFormattingBar by remember { mutableStateOf(false) }
              var isDrawingMode by remember { mutableStateOf(false) }
              var activeBold by remember { mutableStateOf(false) }
              var activeItalic by remember { mutableStateOf(false) }
              var showMoreMenu by remember { mutableStateOf(false) }
              var showLinkDialog by remember { mutableStateOf(false) }
              var showReminderSheet by remember { mutableStateOf(false) }

              var selectedTool by remember { mutableStateOf(DrawingTool.PEN) }
              var selectedColorIndex by remember { mutableStateOf(0) }
              var penSizeIndex by remember { mutableStateOf(2) }
              var eraserSizeIndex by remember { mutableStateOf(1) }

              val currentToolSizeIndex = if (selectedTool == DrawingTool.ERASER) eraserSizeIndex else penSizeIndex

              val bodyFocusRequester = remember { FocusRequester() }
              val titleFocusRequester = remember { FocusRequester() }
              val findInputFocusRequester = remember { FocusRequester() }

              val notificationPermissionLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.RequestPermission()
              ) { _ -> }

              LaunchedEffect(note.id) {
                  if (note.title.isEmpty() && note.document.text.isEmpty() && note.document.strokes.isEmpty()) {
                      delay(100)
                      runCatching { titleFocusRequester.requestFocus() }
                  }
              }

              fun buildCurrentNote(): Note = note.copy(
                  title = title.trim(),
                  document = doc,
                  updatedAt = System.currentTimeMillis()
              )

              fun triggerImmediateSave(
                  updatedDoc: RichNoteDocument = doc,
                  updatedTitle: String = title,
                  selection: TextRange = textFieldValue.selection,
                  recordInUndo: Boolean = true,
                  forceNewUndoStep: Boolean = false
              ) {
                  if (recordInUndo) {
                      undoQueue.recordChange(
                          snapshot = EditorSnapshot(
                              title = updatedTitle,
                              document = updatedDoc,
                              selection = selection
                          ),
                          forceNewStep = forceNewUndoStep
                      )
                  }
                  onAutoSave(
                      note.copy(
                          title = updatedTitle.trim(),
                          document = updatedDoc,
                          updatedAt = System.currentTimeMillis()
                      )
                  )
              }

              fun applySnapshot(snapshot: EditorSnapshot) {
                  title = snapshot.title
                  doc = snapshot.document
                  val safeEnd = snapshot.selection.end.coerceIn(0, snapshot.document.text.length)
                  val safeStart = snapshot.selection.start.coerceIn(0, snapshot.document.text.length)
                  textFieldValue = TextFieldValue(
                      text = snapshot.document.text,
                      selection = TextRange(safeStart, safeEnd)
                  )
                  triggerImmediateSave(
                      updatedDoc = snapshot.document,
                      updatedTitle = snapshot.title,
                      selection = TextRange(safeStart, safeEnd),
                      recordInUndo = false
                  )
              }

              BackHandler {
                  when {
                      isFindInNoteVisible -> {
                          isFindInNoteVisible = false
                          findQuery = ""
                      }
                      isDrawingMode -> {
                          isDrawingMode = false
                      }
                      else -> {
                          onAutoSave(buildCurrentNote())
                          onBack()
                      }
                  }
              }

              val currentCursor = textFieldValue.selection.start.coerceIn(0, textFieldValue.text.length)
              val currentLineIndex = remember(textFieldValue.text, currentCursor) {
                  textFieldValue.text.substring(0, currentCursor).count { it == '\n' }
              }
              val currentHeadingStyle = doc.lineHeadings[currentLineIndex] ?: HeadingStyle.TEXT

              val isSelectionBold = remember(doc.spans, textFieldValue.selection, activeBold) {
                  val sel = textFieldValue.selection
                  if (!sel.collapsed) {
                      doc.spans.any { it.start <= sel.min && it.end >= sel.max && it.bold }
                  } else {
                      activeBold || doc.spans.any { it.start < sel.start && it.end >= sel.start && it.bold }
                  }
              }

              val isSelectionItalic = remember(doc.spans, textFieldValue.selection, activeItalic) {
                  val sel = textFieldValue.selection
                  if (!sel.collapsed) {
                      doc.spans.any { it.start <= sel.min && it.end >= sel.max && it.italic }
                  } else {
                      activeItalic || doc.spans.any { it.start < sel.start && it.end >= sel.start && it.italic }
                  }
              }

              val isTextToolbarVisible = !isDrawingMode && (showFormattingBar || !textFieldValue.selection.collapsed)

              val accentColor = palette.newFolderAccent
              val mutedColor = palette.secondaryText
              val visualTransformation = remember(
                  doc,
                  baseFontSizeSp,
                  accentColor,
                  mutedColor,
                  findMatches,
                  activeMatchIdx
              ) {
                  WysiwygVisualTransformation(
                      doc = doc,
                      baseFontSizeSp = baseFontSizeSp,
                      accentColor = accentColor,
                      mutedColor = mutedColor,
                      searchMatches = findMatches,
                      activeMatchIndex = activeMatchIdx
                  )
              }

              fun toggleLinePrefix(targetPrefix: String) {
                  val raw = textFieldValue.text
                  val cursor = textFieldValue.selection.start.coerceIn(0, raw.length)
                  val lineStart = safeLineStart(raw, cursor)
                  val lineEnd = safeLineEnd(raw, cursor)
                  val currentLine = raw.substring(lineStart, lineEnd)

                  val existingPrefixLen = when {
                      currentLine.startsWith("• ") || currentLine.startsWith("☐ ") || currentLine.startsWith("☑ ") -> 2
                      else -> 0
                  }
                  val alreadyHasTarget = when (targetPrefix) {
                      "☐ " -> currentLine.startsWith("☐ ") || currentLine.startsWith("☑ ")
                      else -> currentLine.startsWith(targetPrefix)
                  }

                  val replacementLine = if (alreadyHasTarget) {
                      currentLine.substring(existingPrefixLen)
                  } else {
                      targetPrefix + currentLine.substring(existingPrefixLen)
                  }

                  val newText = raw.substring(0, lineStart) + replacementLine + raw.substring(lineEnd)
                  val lengthDelta = replacementLine.length - currentLine.length
                  val newCursor = (cursor + lengthDelta).coerceIn(lineStart, lineStart + replacementLine.length)
                  val newSelection = TextRange(newCursor)

                  val updatedDoc = adjustDocumentOnEdit(doc, newText, activeBold = false, activeItalic = false)
                  doc = updatedDoc
                  textFieldValue = TextFieldValue(text = newText, selection = newSelection)
                  triggerImmediateSave(updatedDoc = updatedDoc, selection = newSelection, forceNewUndoStep = true)
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(palette.screenBg)
                      .windowInsetsPadding(WindowInsets.statusBars)
                      .imePadding()
              ) {
                  // Editor Top Header Bar (No "Saving/Saved" text; includes Reminder Bell & Find in Note)
                  Box(
                      modifier = Modifier.fillMaxWidth(),
                      contentAlignment = Alignment.Center
                  ) {
                      Row(
                          modifier = Modifier
                              .widthIn(max = 720.dp)
                              .fillMaxWidth()
                              .padding(horizontal = 8.dp, vertical = 6.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(
                              onClick = {
                                  onAutoSave(buildCurrentNote())
                                  onBack()
                              }
                          ) {
                              Icon(
                                  imageVector = Icons.AutoMirrored.Filled.ArrowBack,
                                  contentDescription = "Back to notes",
                                  tint = palette.primaryText
                              )
                          }

                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(2.dp)
                          ) {
                              IconButton(
                                  onClick = { undoQueue.undo()?.let { applySnapshot(it) } },
                                  enabled = undoQueue.canUndo
                              ) {
                                  Icon(
                                      imageVector = Icons.AutoMirrored.Filled.Undo,
                                      contentDescription = "Undo",
                                      tint = if (undoQueue.canUndo) palette.primaryText
                                      else palette.secondaryText.copy(alpha = 0.3f),
                                      modifier = Modifier.size(20.dp)
                                  )
                              }

                              IconButton(
                                  onClick = { undoQueue.redo()?.let { applySnapshot(it) } },
                                  enabled = undoQueue.canRedo
                              ) {
                                  Icon(
                                      imageVector = Icons.AutoMirrored.Filled.Redo,
                                      contentDescription = "Redo",
                                      tint = if (undoQueue.canRedo) palette.primaryText
                                      else palette.secondaryText.copy(alpha = 0.3f),
                                      modifier = Modifier.size(20.dp)
                                  )
                              }

                              // Keep-Style Reminder Bell Button
                              val hasActiveReminder = doc.reminderAt != null && doc.reminderAt!! > System.currentTimeMillis()
                              IconButton(
                                  onClick = {
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                          if (ContextCompat.checkSelfPermission(
                                                  context,
                                                  Manifest.permission.POST_NOTIFICATIONS
                                              ) != PackageManager.PERMISSION_GRANTED
                                          ) {
                                              notificationPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                                          }
                                      }
                                      showReminderSheet = true
                                  }
                              ) {
                                  Icon(
                                      imageVector = if (hasActiveReminder) Icons.Default.NotificationsActive
                                      else Icons.Outlined.Notifications,
                                      contentDescription = "Reminder",
                                      tint = if (hasActiveReminder) palette.newFolderAccent else palette.secondaryText,
                                      modifier = Modifier.size(20.dp)
                                  )
                              }

                              // Find in Note (Search inside current note)
                              IconButton(
                                  onClick = {
                                      isFindInNoteVisible = !isFindInNoteVisible
                                      if (!isFindInNoteVisible) {
                                          findQuery = ""
                                      }
                                  }
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.Search,
                                      contentDescription = "Find in note",
                                      tint = if (isFindInNoteVisible) palette.newFolderAccent else palette.secondaryText,
                                      modifier = Modifier.size(20.dp)
                                  )
                              }

                              IconButton(
                                  onClick = {
                                      isDrawingMode = !isDrawingMode
                                      if (isDrawingMode) {
                                          showFormattingBar = false
                                          focusManager.clearFocus()
                                      }
                                  }
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.Brush,
                                      contentDescription = "Draw or sketch",
                                      tint = if (isDrawingMode) palette.newFolderAccent else palette.secondaryText,
                                      modifier = Modifier.size(20.dp)
                                  )
                              }

                              IconButton(
                                  onClick = {
                                      if (isDrawingMode) isDrawingMode = false
                                      showFormattingBar = !showFormattingBar
                                  }
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.FormatSize,
                                      contentDescription = "Format text",
                                      tint = if (isTextToolbarVisible) palette.newFolderAccent else palette.secondaryText,
                                      modifier = Modifier.size(20.dp)
                                  )
                              }

                              Box {
                                  IconButton(onClick = { showMoreMenu = true }) {
                                      Icon(
                                          imageVector = Icons.Default.MoreHoriz,
                                          contentDescription = "Note options",
                                          tint = palette.secondaryText
                                      )
                                  }
                                  DropdownMenu(
                                      expanded = showMoreMenu,
                                      onDismissRequest = { showMoreMenu = false },
                                      shape = RoundedCornerShape(14.dp),
                                      containerColor = palette.surface
                                  ) {
                                      DropdownMenuItem(
                                          text = { Text("Find in note") },
                                          leadingIcon = {
                                              Icon(Icons.Default.Search, null, Modifier.size(18.dp))
                                          },
                                          onClick = {
                                              showMoreMenu = false
                                              isFindInNoteVisible = true
                                          }
                                      )
                                      DropdownMenuItem(
                                          text = { Text("Select all text") },
                                          leadingIcon = {
                                              Icon(Icons.Default.SelectAll, null, Modifier.size(18.dp))
                                          },
                                          onClick = {
                                              showMoreMenu = false
                                              runCatching { bodyFocusRequester.requestFocus() }
                                              textFieldValue = textFieldValue.copy(
                                                  selection = TextRange(0, textFieldValue.text.length)
                                              )
                                          }
                                      )
                                      DropdownMenuItem(
                                          text = { Text("Copy entire note") },
                                          leadingIcon = {
                                              Icon(Icons.Default.ContentCopy, null, Modifier.size(18.dp))
                                          },
                                          onClick = {
                                              showMoreMenu = false
                                              val fullText = if (title.isNotBlank()) "$title\n\n${doc.text}" else doc.text
                                              clipboardManager.setText(AnnotatedString(fullText))
                                              Toast.makeText(context, "Copied to clipboard", Toast.LENGTH_SHORT).show()
                                          }
                                      )
                                      HorizontalDivider(
                                          modifier = Modifier.padding(vertical = 4.dp),
                                          color = palette.cardBorder
                                      )
                                      DropdownMenuItem(
                                          text = { Text(if (note.isPinned) "Unpin" else "Pin") },
                                          leadingIcon = {
                                              Icon(
                                                  if (note.isPinned) Icons.Default.PushPin else Icons.Outlined.PushPin,
                                                  null,
                                                  Modifier.size(18.dp)
                                              )
                                          },
                                          onClick = {
                                              showMoreMenu = false
                                              onTogglePin(buildCurrentNote())
                                          }
                                      )
                                      DropdownMenuItem(
                                          text = { Text("Rename") },
                                          leadingIcon = {
                                              Icon(Icons.Default.Edit, null, Modifier.size(18.dp))
                                          },
                                          onClick = {
                                              showMoreMenu = false
                                              onRequestRename(buildCurrentNote())
                                          }
                                      )
                                      DropdownMenuItem(
                                          text = { Text("Move to folder") },
                                          leadingIcon = {
                                              Icon(Icons.Outlined.Folder, null, Modifier.size(18.dp))
                                          },
                                          onClick = {
                                              showMoreMenu = false
                                              onRequestMoveFolder(buildCurrentNote())
                                          }
                                      )
                                      HorizontalDivider(
                                          modifier = Modifier.padding(vertical = 4.dp),
                                          color = palette.cardBorder
                                      )
                                      DropdownMenuItem(
                                          text = {
                                              Text(
                                                  text = "Move to Trash",
                                                  color = MaterialTheme.colorScheme.error,
                                                  fontWeight = FontWeight.Medium
                                              )
                                          },
                                          leadingIcon = {
                                              Icon(
                                                  Icons.Default.Delete,
                                                  null,
                                                  tint = MaterialTheme.colorScheme.error,
                                                  modifier = Modifier.size(18.dp)
                                              )
                                          },
                                          onClick = {
                                              showMoreMenu = false
                                              onRequestDelete(buildCurrentNote())
                                          }
                                      )
                                  }
                              }
                          }
                      }
                  }

                  // Find-in-Note Bar (Appears right below the editor header when active)
                  AnimatedVisibility(visible = isFindInNoteVisible) {
                      LaunchedEffect(Unit) {
                          delay(80)
                          runCatching { findInputFocusRequester.requestFocus() }
                      }
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 20.dp, vertical = 6.dp)
                              .height(46.dp)
                              .clip(RoundedCornerShape(14.dp))
                              .background(palette.searchBg, RoundedCornerShape(14.dp))
                              .border(1.dp, palette.cardBorder, RoundedCornerShape(14.dp))
                              .padding(horizontal = 12.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Icon(
                              imageVector = Icons.Default.Search,
                              contentDescription = null,
                              tint = palette.secondaryText,
                              modifier = Modifier.size(18.dp)
                          )
                          Spacer(Modifier.width(8.dp))
                          Box(
                              modifier = Modifier.weight(1f),
                              contentAlignment = Alignment.CenterStart
                          ) {
                              if (findQuery.isEmpty()) {
                                  Text(
                                      text = "Find in note…",
                                      fontSize = 15.sp,
                                      color = palette.secondaryText
                                  )
                              }
                              BasicTextField(
                                  value = findQuery,
                                  onValueChange = {
                                      findQuery = it
                                      activeMatchIdx = 0
                                  },
                                  singleLine = true,
                                  textStyle = TextStyle(
                                      fontSize = 15.sp,
                                      color = palette.primaryText
                                  ),
                                  cursorBrush = SolidColor(palette.primaryText),
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .focusRequester(findInputFocusRequester)
                              )
                          }

                          if (findQuery.isNotEmpty()) {
                              Text(
                                  text = if (findMatches.isEmpty()) "0/0"
                                  else "${activeMatchIdx + 1}/${findMatches.size}",
                                  fontSize = 13.sp,
                                  color = palette.secondaryText,
                                  modifier = Modifier.padding(horizontal = 6.dp)
                              )
                              IconButton(
                                  onClick = {
                                      if (findMatches.isNotEmpty()) {
                                          activeMatchIdx = (activeMatchIdx - 1).mod(findMatches.size)
                                      }
                                  },
                                  enabled = findMatches.isNotEmpty(),
                                  modifier = Modifier.size(32.dp)
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.KeyboardArrowUp,
                                      contentDescription = "Previous match",
                                      tint = palette.primaryText,
                                      modifier = Modifier.size(20.dp)
                                  )
                              }
                              IconButton(
                                  onClick = {
                                      if (findMatches.isNotEmpty()) {
                                          activeMatchIdx = (activeMatchIdx + 1).mod(findMatches.size)
                                      }
                                  },
                                  enabled = findMatches.isNotEmpty(),
                                  modifier = Modifier.size(32.dp)
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.KeyboardArrowDown,
                                      contentDescription = "Next match",
                                      tint = palette.primaryText,
                                      modifier = Modifier.size(20.dp)
                                  )
                              }
                          }

                          IconButton(
                              onClick = {
                                  isFindInNoteVisible = false
                                  findQuery = ""
                              },
                              modifier = Modifier.size(32.dp)
                          ) {
                              Icon(
                                  imageVector = Icons.Default.Close,
                                  contentDescription = "Close find",
                                  tint = palette.secondaryText,
                                  modifier = Modifier.size(18.dp)
                              )
                          }
                      }
                  }

                  // Main Writing & Edge-to-Edge Sketching Scroll Area
                  var viewportRootY by remember { mutableStateOf(0f) }

                  Column(
                      modifier = Modifier
                          .weight(1f)
                          .fillMaxWidth()
                          .onGloballyPositioned { coords ->
                              scrollViewportHeightPx = coords.size.height
                              viewportRootY = coords.positionInRoot().y
                          }
                          .pointerInput(Unit) {
                              awaitEachGesture {
                                  val down = awaitFirstDown(requireUnconsumed = false)
                                  selectionDragFingerYInViewport = down.position.y
                                  do {
                                      val event = awaitPointerEvent()
                                      val change = event.changes.firstOrNull()
                                      if (change != null && change.pressed) {
                                          selectionDragFingerYInViewport = change.position.y
                                      }
                                  } while (event.changes.any { it.pressed })
                                  selectionDragFingerYInViewport = null
                              }
                          }
                          .verticalScroll(scrollState, enabled = !isDrawingMode),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Column(
                          modifier = Modifier
                              .widthIn(max = 680.dp)
                              .fillMaxWidth()
                              .padding(horizontal = 20.dp, vertical = 12.dp)
                      ) {
                          // Folder + Active Reminder Pills
                          Row(
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              if (note.folder.isNotBlank() || hasFolders) {
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(12.dp))
                                          .background(palette.surface, RoundedCornerShape(12.dp))
                                          .border(1.dp, palette.cardBorder, RoundedCornerShape(12.dp))
                                          .clickable { onRequestMoveFolder(buildCurrentNote()) }
                                          .padding(horizontal = 10.dp, vertical = 5.dp)
                                  ) {
                                      Icon(
                                          imageVector = Icons.Outlined.Folder,
                                          contentDescription = null,
                                          tint = palette.secondaryText,
                                          modifier = Modifier.size(14.dp)
                                      )
                                      Spacer(Modifier.width(5.dp))
                                      Text(
                                          text = note.folder.ifBlank { "Move to folder" },
                                          fontSize = 12.sp,
                                          color = palette.secondaryText
                                      )
                                  }
                              }

                              if (doc.reminderAt != null) {
                                  val isPast = doc.reminderAt!! < System.currentTimeMillis()
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(12.dp))
                                          .background(palette.surface, RoundedCornerShape(12.dp))
                                          .border(
                                              1.dp,
                                              if (isPast) palette.cardBorder else palette.newFolderAccent,
                                              RoundedCornerShape(12.dp)
                                          )
                                          .clickable { showReminderSheet = true }
                                          .padding(horizontal = 10.dp, vertical = 5.dp)
                                  ) {
                                      Icon(
                                          imageVector = Icons.Outlined.Notifications,
                                          contentDescription = null,
                                          tint = if (isPast) palette.secondaryText else palette.newFolderAccent,
                                          modifier = Modifier.size(14.dp)
                                      )
                                      Spacer(Modifier.width(5.dp))
                                      Text(
                                          text = formatReminderBadge(doc.reminderAt!!),
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Medium,
                                          color = if (isPast) palette.secondaryText else palette.primaryText,
                                          textDecoration = if (isPast) TextDecoration.LineThrough else TextDecoration.None
                                      )
                                  }
                              }
                          }

                          if (note.folder.isNotBlank() || hasFolders || doc.reminderAt != null) {
                              Spacer(Modifier.height(10.dp))
                          }

                          // Separate Title Field
                          Box(modifier = Modifier.fillMaxWidth()) {
                              if (title.isEmpty()) {
                                  Text(
                                      text = "Title",
                                      fontSize = 26.sp,
                                      fontWeight = FontWeight.SemiBold,
                                      letterSpacing = (-0.4).sp,
                                      color = palette.secondaryText.copy(alpha = 0.55f)
                                  )
                              }
                              BasicTextField(
                                  value = title,
                                  onValueChange = { newTitle ->
                                      title = newTitle
                                      triggerImmediateSave(updatedTitle = newTitle)
                                  },
                                  textStyle = TextStyle(
                                      fontSize = 26.sp,
                                      fontWeight = FontWeight.SemiBold,
                                      lineHeight = 32.sp,
                                      letterSpacing = (-0.4).sp,
                                      color = palette.primaryText
                                  ),
                                  keyboardOptions = KeyboardOptions(
                                      capitalization = KeyboardCapitalization.Sentences,
                                      imeAction = ImeAction.Next
                                  ),
                                  keyboardActions = KeyboardActions(
                                      onNext = { runCatching { bodyFocusRequester.requestFocus() } }
                                  ),
                                  cursorBrush = SolidColor(palette.primaryText),
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .focusRequester(titleFocusRequester)
                              )
                          }
                      }

                      // Full-Bleed Edge-to-Edge Sketch Canvas
                      if (isDrawingMode || doc.strokes.isNotEmpty()) {
                          EdgeToEdgeSketchCanvas(
                              strokes = doc.strokes,
                              canvasHeightDp = doc.canvasHeightDp,
                              isDrawingMode = isDrawingMode,
                              selectedTool = selectedTool,
                              selectedColorIndex = selectedColorIndex,
                              selectedSizeIndex = currentToolSizeIndex,
                              onActivateDrawingMode = {
                                  isDrawingMode = true
                                  showFormattingBar = false
                                  focusManager.clearFocus()
                              },
                              onCommitStrokes = { updatedStrokes ->
                                  val updatedDoc = doc.copy(strokes = updatedStrokes)
                                  doc = updatedDoc
                                  triggerImmediateSave(updatedDoc = updatedDoc, forceNewUndoStep = true)
                              },
                              onExpandCanvas = {
                                  val updatedDoc = doc.copy(canvasHeightDp = (doc.canvasHeightDp + 200).coerceAtMost(2600))
                                  doc = updatedDoc
                                  triggerImmediateSave(updatedDoc = updatedDoc, recordInUndo = false)
                              }
                          )
                      }

                      // Body WYSIWYG Text Editor (Crash-hardened on Enter at index 0 & smooth selection)
                      Column(
                          modifier = Modifier
                              .widthIn(max = 680.dp)
                              .fillMaxWidth()
                              .padding(horizontal = 20.dp, vertical = 12.dp)
                              .onGloballyPositioned { coords ->
                                  val relY = coords.positionInRoot().y - viewportRootY + scrollState.value
                                  bodyTopOffsetInContentPx = relY.roundToInt().coerceAtLeast(0)
                              }
                      ) {
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .defaultMinSize(minHeight = 400.dp)
                          ) {
                              if (textFieldValue.text.isEmpty()) {
                                  Text(
                                      text = "Start writing…",
                                      fontSize = baseFontSizeSp.sp,
                                      lineHeight = (baseFontSizeSp * 1.6f).sp,
                                      color = palette.secondaryText.copy(alpha = 0.55f)
                                  )
                              }

                              BasicTextField(
                                  value = textFieldValue,
                                  onTextLayout = { layoutResult ->
                                      latestTextLayout = layoutResult
                                  },
                                  onValueChange = { incoming ->
                                      if (isDrawingMode) isDrawingMode = false
                                      val oldText = textFieldValue.text
                                      val newText = incoming.text

                                      // 1. Checkbox tap toggle (☐ / ☑)
                                      if (newText == oldText && incoming.selection.collapsed && incoming.selection != textFieldValue.selection) {
                                          val tapOffset = incoming.selection.start.coerceIn(0, newText.length)
                                          val lineStart = safeLineStart(newText, tapOffset)
                                          val lineEnd = safeLineEnd(newText, tapOffset)
                                          val line = newText.substring(lineStart, lineEnd)

                                          if ((line.startsWith("☐ ") || line.startsWith("☑ ")) && tapOffset <= lineStart + 2) {
                                              val toggledPrefix = if (line.startsWith("☐ ")) "☑ " else "☐ "
                                              val updatedText = newText.substring(0, lineStart) + toggledPrefix + line.substring(2)
                                              val updatedDoc = doc.copy(text = updatedText)
                                              val newSel = TextRange((lineStart + 2).coerceAtMost(updatedText.length))
                                              doc = updatedDoc
                                              textFieldValue = TextFieldValue(text = updatedText, selection = newSel)
                                              triggerImmediateSave(updatedDoc = updatedDoc, selection = newSel, forceNewUndoStep = true)
                                              return@BasicTextField
                                          }
                                      }

                                      // 2. Crash-proof smart list continuation when pressing Enter
                                      if (newText.length == oldText.length + 1 && incoming.selection.collapsed && newText.isNotEmpty()) {
                                          val rawInsIdx = incoming.selection.start - 1
                                          if (rawInsIdx in 0..newText.lastIndex && newText[rawInsIdx] == '\n') {
                                              val prevLineStart = safeLineStart(newText, rawInsIdx)
                                              val prevLine = if (rawInsIdx >= prevLineStart) {
                                                  newText.substring(prevLineStart, rawInsIdx)
                                              } else ""

                                              when {
                                                  prevLine == "• " || prevLine == "☐ " || prevLine == "☑ " -> {
                                                      val afterNewline = (rawInsIdx + 1).coerceAtMost(newText.length)
                                                      val cleanedText = newText.substring(0, prevLineStart) + newText.substring(afterNewline)
                                                      val updatedDoc = adjustDocumentOnEdit(doc, cleanedText, activeBold, activeItalic)
                                                      val newSel = TextRange(prevLineStart.coerceIn(0, cleanedText.length))
                                                      doc = updatedDoc
                                                      textFieldValue = TextFieldValue(text = cleanedText, selection = newSel)
                                                      triggerImmediateSave(updatedDoc = updatedDoc, selection = newSel, forceNewUndoStep = true)
                                                      return@BasicTextField
                                                  }
                                                  prevLine.startsWith("• ") -> {
                                                      val splitPos = (rawInsIdx + 1).coerceAtMost(newText.length)
                                                      val autoText = newText.substring(0, splitPos) + "• " + newText.substring(splitPos)
                                                      val updatedDoc = adjustDocumentOnEdit(doc, autoText, activeBold, activeItalic)
                                                      val newSel = TextRange((rawInsIdx + 3).coerceIn(0, autoText.length))
                                                      doc = updatedDoc
                                                      textFieldValue = TextFieldValue(text = autoText, selection = newSel)
                                                      triggerImmediateSave(updatedDoc = updatedDoc, selection = newSel, forceNewUndoStep = true)
                                                      return@BasicTextField
                                                  }
                                                  prevLine.startsWith("☐ ") || prevLine.startsWith("☑ ") -> {
                                                      val splitPos = (rawInsIdx + 1).coerceAtMost(newText.length)
                                                      val autoText = newText.substring(0, splitPos) + "☐ " + newText.substring(splitPos)
                                                      val updatedDoc = adjustDocumentOnEdit(doc, autoText, activeBold, activeItalic)
                                                      val newSel = TextRange((rawInsIdx + 3).coerceIn(0, autoText.length))
                                                      doc = updatedDoc
                                                      textFieldValue = TextFieldValue(text = autoText, selection = newSel)
                                                      triggerImmediateSave(updatedDoc = updatedDoc, selection = newSel, forceNewUndoStep = true)
                                                      return@BasicTextField
                                                  }
                                              }
                                          }
                                      }

                                      // 3. Standard WYSIWYG character / span update
                                      if (newText != oldText) {
                                          val updatedDoc = adjustDocumentOnEdit(doc, newText, activeBold, activeItalic)
                                          doc = updatedDoc
                                          textFieldValue = incoming
                                          triggerImmediateSave(updatedDoc = updatedDoc, selection = incoming.selection)
                                      } else {
                                          textFieldValue = incoming
                                      }
                                  },
                                  textStyle = TextStyle(
                                      fontSize = baseFontSizeSp.sp,
                                      lineHeight = (baseFontSizeSp * 1.6f).sp,
                                      color = palette.primaryText
                                  ),
                                  keyboardOptions = KeyboardOptions(capitalization = KeyboardCapitalization.Sentences),
                                  visualTransformation = visualTransformation,
                                  cursorBrush = SolidColor(palette.primaryText),
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .defaultMinSize(minHeight = 400.dp)
                                      .focusRequester(bodyFocusRequester)
                              )
                          }

                          Spacer(Modifier.height(140.dp))
                      }
                  }

                  AnimatedVisibility(
                      visible = isDrawingMode,
                      enter = slideInVertically(initialOffsetY = { it }) + fadeIn(),
                      exit = slideOutVertically(targetOffsetY = { it }) + fadeOut()
                  ) {
                      DrawingToolbar(
                          selectedTool = selectedTool,
                          selectedColorIndex = selectedColorIndex,
                          selectedSizeIndex = currentToolSizeIndex,
                          hasStrokes = doc.strokes.isNotEmpty(),
                          onSelectTool = { selectedTool = it },
                          onSelectColor = { selectedColorIndex = it },
                          onSelectSize = { newIdx ->
                              if (selectedTool == DrawingTool.ERASER) {
                                  eraserSizeIndex = newIdx
                              } else {
                                  penSizeIndex = newIdx
                              }
                          },
                          onClearCanvas = {
                              if (doc.strokes.isNotEmpty()) {
                                  val updatedDoc = doc.copy(strokes = emptyList())
                                  doc = updatedDoc
                                  triggerImmediateSave(updatedDoc = updatedDoc, forceNewUndoStep = true)
                              }
                          },
                          onDoneDrawing = { isDrawingMode = false }
                      )
                  }

                  AnimatedVisibility(
                      visible = isTextToolbarVisible,
                      enter = slideInVertically(initialOffsetY = { it }) + fadeIn(),
                      exit = slideOutVertically(targetOffsetY = { it }) + fadeOut()
                  ) {
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(palette.surface)
                              .border(1.dp, palette.cardBorder)
                              .padding(vertical = 6.dp),
                          contentAlignment = Alignment.Center
                      ) {
                          FormattingToolbar(
                              currentHeading = currentHeadingStyle,
                              isBoldActive = isSelectionBold,
                              isItalicActive = isSelectionItalic,
                              onSelectHeading = { chosenStyle ->
                                  val updatedMap = doc.lineHeadings.toMutableMap()
                                  if (chosenStyle == HeadingStyle.TEXT) {
                                      updatedMap.remove(currentLineIndex)
                                  } else {
                                      updatedMap[currentLineIndex] = chosenStyle
                                  }
                                  val updatedDoc = doc.copy(lineHeadings = updatedMap)
                                  doc = updatedDoc
                                  triggerImmediateSave(updatedDoc = updatedDoc, forceNewUndoStep = true)
                              },
                              onToggleBold = {
                                  val sel = textFieldValue.selection
                                  if (!sel.collapsed) {
                                      val updatedDoc = toggleSelectionInlineStyle(doc, sel, toggleBold = true)
                                      doc = updatedDoc
                                      triggerImmediateSave(updatedDoc = updatedDoc, forceNewUndoStep = true)
                                  } else {
                                      activeBold = !activeBold
                                  }
                              },
                              onToggleItalic = {
                                  val sel = textFieldValue.selection
                                  if (!sel.collapsed) {
                                      val updatedDoc = toggleSelectionInlineStyle(doc, sel, toggleItalic = true)
                                      doc = updatedDoc
                                      triggerImmediateSave(updatedDoc = updatedDoc, forceNewUndoStep = true)
                                  } else {
                                      activeItalic = !activeItalic
                                  }
                              },
                              onToggleBulletList = { toggleLinePrefix("• ") },
                              onToggleChecklist = { toggleLinePrefix("☐ ") },
                              onOpenLinkDialog = { showLinkDialog = true }
                          )
                      }
                  }
              }

              // Keep-Style Reminder Bottom Sheet
              if (showReminderSheet) {
                  KeepStyleReminderSheet(
                      prefs = prefs,
                      currentReminderAt = doc.reminderAt,
                      onDismiss = { showReminderSheet = false },
                      onScheduleReminder = { triggerMillis ->
                          val updatedDoc = doc.copy(reminderAt = triggerMillis)
                          doc = updatedDoc
                          val savedNote = note.copy(
                              title = title.trim(),
                              document = updatedDoc,
                              updatedAt = System.currentTimeMillis()
                          )
                          onAutoSave(savedNote)
                          scheduleNoteReminderAlarm(context, savedNote, triggerMillis)
                          showReminderSheet = false
                          Toast.makeText(
                              context,
                              "Reminder set for ${formatReminderBadge(triggerMillis)}",
                              Toast.LENGTH_SHORT
                          ).show()
                      },
                      onRemoveReminder = {
                          val updatedDoc = doc.copy(reminderAt = null)
                          doc = updatedDoc
                          onAutoSave(
                              note.copy(
                                  title = title.trim(),
                                  document = updatedDoc,
                                  updatedAt = System.currentTimeMillis()
                              )
                          )
                          cancelNoteReminderAlarm(context, note.id)
                          showReminderSheet = false
                          Toast.makeText(context, "Reminder removed", Toast.LENGTH_SHORT).show()
                      }
                  )
              }

              if (showLinkDialog) {
                  val sel = textFieldValue.selection
                  val selectedLabel = if (!sel.collapsed) textFieldValue.text.substring(sel.min, sel.max) else ""

                  InsertLinkDialog(
                      initialLabel = selectedLabel,
                      onDismiss = { showLinkDialog = false },
                      onInsertLink = { label, url ->
                          val raw = textFieldValue.text
                          val insertStart = sel.min.coerceIn(0, raw.length)
                          val insertEnd = sel.max.coerceIn(0, raw.length)
                          val displayLabel = label.ifBlank { url }
                          val newText = raw.substring(0, insertStart) + displayLabel + raw.substring(insertEnd)
                          val adjustedDoc = adjustDocumentOnEdit(doc, newText, activeBold = false, activeItalic = false)
                          val linkedSpans = normalizeSpans(
                              adjustedDoc.spans + InlineStyleSpan(
                                  start = insertStart,
                                  end = insertStart + displayLabel.length,
                                  link = url
                              ),
                              newText.length
                          )
                          val finalDoc = adjustedDoc.copy(spans = linkedSpans)
                          val newSel = TextRange(insertStart + displayLabel.length)
                          doc = finalDoc
                          textFieldValue = TextFieldValue(text = newText, selection = newSel)
                          triggerImmediateSave(updatedDoc = finalDoc, selection = newSel, forceNewUndoStep = true)
                          showLinkDialog = false
                      }
                  )
              }
          }

          // ============================================================================
          // GOOGLE KEEP-STYLE REMINDER SHEET (WITH CUSTOMIZABLE PRESETS & MANUAL PICKER)
          // ============================================================================

          @Composable
          fun KeepStyleReminderSheet(
              prefs: SharedPreferences,
              currentReminderAt: Long?,
              onDismiss: () -> Unit,
              onScheduleReminder: (Long) -> Unit,
              onRemoveReminder: () -> Unit
          ) {
              val context = LocalContext.current
              val palette = LocalFolioPalette.current

              var morningHour by remember { mutableStateOf(prefs.getInt("preset_morning_h", 8)) }
              var morningMin by remember { mutableStateOf(prefs.getInt("preset_morning_m", 0)) }
              var eveningHour by remember { mutableStateOf(prefs.getInt("preset_evening_h", 18)) }
              var eveningMin by remember { mutableStateOf(prefs.getInt("preset_evening_m", 0)) }
              var sundayHour by remember { mutableStateOf(prefs.getInt("preset_sunday_h", 9)) }
              var sundayMin by remember { mutableStateOf(prefs.getInt("preset_sunday_m", 0)) }

              var isCustomizingPresets by remember { mutableStateOf(false) }

              fun formatHourMin(h: Int, m: Int): String {
                  val cal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, h)
                      set(Calendar.MINUTE, m)
                  }
                  return SimpleDateFormat("h:mm a", Locale.getDefault()).format(cal.time)
              }

              fun computeTomorrowAt(h: Int, m: Int): Long {
                  return Calendar.getInstance().apply {
                      add(Calendar.DAY_OF_YEAR, 1)
                      set(Calendar.HOUR_OF_DAY, h)
                      set(Calendar.MINUTE, m)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                  }.timeInMillis
              }

              fun computeNextSundayAt(h: Int, m: Int): Long {
                  val cal = Calendar.getInstance()
                  var daysUntilSunday = (Calendar.SUNDAY - cal.get(Calendar.DAY_OF_WEEK) + 7) % 7
                  if (daysUntilSunday == 0) daysUntilSunday = 7
                  cal.add(Calendar.DAY_OF_YEAR, daysUntilSunday)
                  cal.set(Calendar.HOUR_OF_DAY, h)
                  cal.set(Calendar.MINUTE, m)
                  cal.set(Calendar.SECOND, 0)
                  cal.set(Calendar.MILLISECOND, 0)
                  return cal.timeInMillis
              }

              fun openNativeDateTimePicker() {
                  val baseCal = Calendar.getInstance().apply {
                      if (currentReminderAt != null && currentReminderAt > System.currentTimeMillis()) {
                          timeInMillis = currentReminderAt
                      } else {
                          add(Calendar.HOUR_OF_DAY, 1)
                          set(Calendar.MINUTE, 0)
                      }
                  }
                  DatePickerDialog(
                      context,
                      { _, year, month, dayOfMonth ->
                          TimePickerDialog(
                              context,
                              { _, hourOfDay, minute ->
                                  val picked = Calendar.getInstance().apply {
                                      set(Calendar.YEAR, year)
                                      set(Calendar.MONTH, month)
                                      set(Calendar.DAY_OF_MONTH, dayOfMonth)
                                      set(Calendar.HOUR_OF_DAY, hourOfDay)
                                      set(Calendar.MINUTE, minute)
                                      set(Calendar.SECOND, 0)
                                      set(Calendar.MILLISECOND, 0)
                                  }.timeInMillis
                                  onScheduleReminder(picked)
                              },
                              baseCal.get(Calendar.HOUR_OF_DAY),
                              baseCal.get(Calendar.MINUTE),
                              false
                          ).show()
                      },
                      baseCal.get(Calendar.YEAR),
                      baseCal.get(Calendar.MONTH),
                      baseCal.get(Calendar.DAY_OF_MONTH)
                  ).apply {
                      datePicker.minDate = System.currentTimeMillis() - 1000L
                  }.show()
              }

              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  shape = RoundedCornerShape(topStart = 22.dp, topEnd = 22.dp),
                  containerColor = palette.surface
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 20.dp, vertical = 8.dp)
                          .windowInsetsPadding(WindowInsets.navigationBars)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 8.dp, vertical = 6.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              text = if (isCustomizingPresets) "Customize preset times" else "Remind me",
                              fontSize = 19.sp,
                              fontWeight = FontWeight.Bold,
                              color = palette.primaryText
                          )

                          TextButton(
                              onClick = { isCustomizingPresets = !isCustomizingPresets }
                          ) {
                              Text(
                                  text = if (isCustomizingPresets) "Done" else "Edit preset times",
                                  fontSize = 13.5.sp,
                                  fontWeight = FontWeight.SemiBold,
                                  color = palette.newFolderAccent
                              )
                          }
                      }

                      if (currentReminderAt != null) {
                          Surface(
                              color = palette.searchBg,
                              shape = RoundedCornerShape(14.dp),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 8.dp, vertical = 6.dp)
                          ) {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(horizontal = 14.dp, vertical = 10.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column {
                                      Text(
                                          text = "Active reminder",
                                          fontSize = 12.sp,
                                          color = palette.secondaryText
                                      )
                                      Text(
                                          text = formatReminderBadge(currentReminderAt),
                                          fontSize = 15.sp,
                                          fontWeight = FontWeight.SemiBold,
                                          color = palette.primaryText
                                      )
                                  }
                                  TextButton(onClick = onRemoveReminder) {
                                      Text(
                                          text = "Remove",
                                          color = MaterialTheme.colorScheme.error,
                                          fontWeight = FontWeight.SemiBold
                                      )
                                  }
                              }
                          }
                      }

                      Spacer(Modifier.height(6.dp))

                      // Preset 1: Tomorrow morning
                      ReminderPresetRow(
                          title = "Tomorrow morning",
                          timeLabel = formatHourMin(morningHour, morningMin),
                          isEditing = isCustomizingPresets,
                          onClick = {
                              if (isCustomizingPresets) {
                                  TimePickerDialog(
                                      context,
                                      { _, h, m ->
                                          morningHour = h
                                          morningMin = m
                                          prefs.edit()
                                              .putInt("preset_morning_h", h)
                                              .putInt("preset_morning_m", m)
                                              .apply()
                                      },
                                      morningHour,
                                      morningMin,
                                      false
                                  ).show()
                              } else {
                                  onScheduleReminder(computeTomorrowAt(morningHour, morningMin))
                              }
                          }
                      )

                      // Preset 2: Tomorrow evening
                      ReminderPresetRow(
                          title = "Tomorrow evening",
                          timeLabel = formatHourMin(eveningHour, eveningMin),
                          isEditing = isCustomizingPresets,
                          onClick = {
                              if (isCustomizingPresets) {
                                  TimePickerDialog(
                                      context,
                                      { _, h, m ->
                                          eveningHour = h
                                          eveningMin = m
                                          prefs.edit()
                                              .putInt("preset_evening_h", h)
                                              .putInt("preset_evening_m", m)
                                              .apply()
                                      },
                                      eveningHour,
                                      eveningMin,
                                      false
                                  ).show()
                              } else {
                                  onScheduleReminder(computeTomorrowAt(eveningHour, eveningMin))
                              }
                          }
                      )

                      // Preset 3: Sunday morning
                      ReminderPresetRow(
                          title = "Sunday morning",
                          timeLabel = "Sun, ${formatHourMin(sundayHour, sundayMin)}",
                          isEditing = isCustomizingPresets,
                          onClick = {
                              if (isCustomizingPresets) {
                                  TimePickerDialog(
                                      context,
                                      { _, h, m ->
                                          sundayHour = h
                                          sundayMin = m
                                          prefs.edit()
                                              .putInt("preset_sunday_h", h)
                                              .putInt("preset_sunday_m", m)
                                              .apply()
                                      },
                                      sundayHour,
                                      sundayMin,
                                      false
                                  ).show()
                              } else {
                                  onScheduleReminder(computeNextSundayAt(sundayHour, sundayMin))
                              }
                          }
                      )

                      HorizontalDivider(
                          modifier = Modifier.padding(vertical = 8.dp, horizontal = 8.dp),
                          color = palette.rowDivider
                      )

                      // Custom manual date & time picker
                      val customInteraction = remember { MutableInteractionSource() }
                      val customPressed by customInteraction.collectIsPressedAsState()
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .heightIn(min = 48.dp)
                              .clip(RoundedCornerShape(12.dp))
                              .background(if (customPressed) palette.pressedRowBg else Color.Transparent)
                              .clickable(
                                  interactionSource = customInteraction,
                                  indication = null,
                                  onClick = { openNativeDateTimePicker() }
                              )
                              .padding(horizontal = 12.dp, vertical = 14.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Icon(
                              imageVector = Icons.Default.CalendarToday,
                              contentDescription = null,
                              tint = palette.newFolderAccent,
                              modifier = Modifier.size(20.dp)
                          )
                          Spacer(Modifier.width(12.dp))
                          Text(
                              text = "Pick a date & time…",
                              fontSize = 16.sp,
                              fontWeight = FontWeight.SemiBold,
                              color = palette.newFolderAccent
                          )
                      }

                      Spacer(Modifier.height(16.dp))
                  }
              }
          }

          @Composable
