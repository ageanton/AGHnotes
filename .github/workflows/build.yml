          fun adjustDocumentOnEdit(oldDoc: RichNoteDocument, newText: String, activeBold: Boolean, activeItalic: Boolean): RichNoteDocument {
              if (oldDoc.text == newText) return oldDoc
              var prefix = 0; val minLen = min(oldDoc.text.length, newText.length)
              while (prefix < minLen && oldDoc.text[prefix] == newText[prefix]) prefix++
              var oldSuffix = oldDoc.text.length; var newSuffix = newText.length
              while (oldSuffix > prefix && newSuffix > prefix && oldDoc.text[oldSuffix - 1] == newText[newSuffix - 1]) { oldSuffix--; newSuffix-- }
              val delta = newText.length - oldDoc.text.length; val insertedCount = newSuffix - prefix
              val updatedSpans = oldDoc.spans.mapNotNull { span ->
                  val ns = if (span.start <= prefix) span.start else max(prefix, span.start + delta)
                  val ne = if (span.end <= prefix) span.end else max(prefix, span.end + delta)
                  if (ne > ns) span.copy(start = ns, end = ne) else null
              }.toMutableList()
              if (insertedCount > 0 && (activeBold || activeItalic)) updatedSpans.add(InlineStyleSpan(prefix, newSuffix, activeBold, activeItalic))
              val removedNL = oldDoc.text.substring(prefix, oldSuffix).count { it == '\n' }; val addedNL = newText.substring(prefix, newSuffix).count { it == '\n' }; val lineDelta = addedNL - removedNL
              val updatedHeadings = if (lineDelta == 0) oldDoc.lineHeadings else {
                  val editLineIndex = oldDoc.text.substring(0, prefix).count { it == '\n' }
                  val map = mutableMapOf<Int, HeadingStyle>()
                  oldDoc.lineHeadings.forEach { (idx, style) ->
                      if (idx < editLineIndex) map[idx] = style
                      else if (idx == editLineIndex) {
                          val lineStartOffset = oldDoc.text.lastIndexOf('\n', max(0, prefix - 1)).let { if (it == -1) 0 else it + 1 }
                          if (addedNL > 0 && prefix == lineStartOffset) map[idx + lineDelta] = style else map[idx] = style
                      } else if (idx + lineDelta >= 0) map[idx + lineDelta] = style
                  }
                  map
              }
              return oldDoc.copy(text = newText, spans = normalizeSpans(updatedSpans, newText.length), lineHeadings = updatedHeadings)
          }

          fun normalizeSpans(spans: List<InlineStyleSpan>, textLength: Int): List<InlineStyleSpan> {
              val clamped = spans.mapNotNull { s -> val start = s.start.coerceIn(0, textLength); val end = s.end.coerceIn(0, textLength); if (end > start && (s.bold || s.italic || !s.link.isNullOrBlank())) s.copy(start = start, end = end) else null }
              if (clamped.isEmpty()) return emptyList()
              val points = clamped.flatMap { listOf(it.start, it.end) }.distinct().sorted()
              val merged = mutableListOf<InlineStyleSpan>()
              for (i in 0 until points.size - 1) {
                  val s = points[i]; val e = points[i + 1]
                  if (e <= s) continue
                  val cov = clamped.filter { it.start <= s && it.end >= e }
                  if (cov.isNotEmpty()) {
                      val b = cov.any { it.bold }; val it = cov.any { it.italic }; val l = cov.lastOrNull { !it.link.isNullOrBlank() }?.link
                      if (b || it || l != null) {
                          val prev = merged.lastOrNull()
                          if (prev != null && prev.end == s && prev.bold == b && prev.italic == it && prev.link == l) merged[merged.lastIndex] = prev.copy(end = e)
                          else merged.add(InlineStyleSpan(s, e, b, it, l))
                      }
                  }
              }
              return merged
          }

          fun toggleSelectionInlineStyle(doc: RichNoteDocument, sel: TextRange, toggleBold: Boolean = false, toggleItalic: Boolean = false): RichNoteDocument {
              val s = sel.min.coerceIn(0, doc.text.length); val e = sel.max.coerceIn(0, doc.text.length); if (e <= s) return doc
              val allB = doc.spans.any { it.start <= s && it.end >= e && it.bold }; val allI = doc.spans.any { it.start <= s && it.end >= e && it.italic }
              val res = mutableListOf<InlineStyleSpan>()
              doc.spans.forEach { span ->
                  if (span.end <= s || span.start >= e) res.add(span)
                  else {
                      if (span.start < s) res.add(span.copy(end = s))
                      if (span.end > e) res.add(span.copy(start = e))
                      val os = max(span.start, s); val oe = min(span.end, e)
                      val nb = if (toggleBold) !allB else span.bold; val ni = if (toggleItalic) !allI else span.italic
                      if (nb || ni || span.link != null) res.add(span.copy(start = os, end = oe, bold = nb, italic = ni))
                  }
              }
              if (toggleBold && !allB) res.add(InlineStyleSpan(s, e, bold = true)); if (toggleItalic && !allI) res.add(InlineStyleSpan(s, e, italic = true))
              return doc.copy(spans = normalizeSpans(res, doc.text.length))
          }

          class WysiwygVisualTransformation(private val doc: RichNoteDocument, private val baseFontSizeSp: Float, private val accentColor: Color, private val mutedColor: Color) : VisualTransformation {
              override fun filter(text: AnnotatedString): TransformedText {
                  val styled = buildAnnotatedString {
                      append(text.text); var ls = 0; var idx = 0
                      text.text.split('\n').forEach { line ->
                          val le = ls + line.length
                          if (le > ls) {
                              when (doc.lineHeadings[idx]) {
                                  HeadingStyle.LARGE -> addStyle(SpanStyle(fontSize = (baseFontSizeSp+7f).sp, fontWeight = FontWeight.SemiBold, letterSpacing = (-0.3).sp), ls, le)
                                  HeadingStyle.SMALL -> addStyle(SpanStyle(fontSize = (baseFontSizeSp+3f).sp, fontWeight = FontWeight.SemiBold, letterSpacing = (-0.15).sp), ls, le)
                                  else -> {}
                              }
                              if (line.startsWith("• ")) addStyle(SpanStyle(color = accentColor, fontWeight = FontWeight.Bold), ls, min(ls + 2, le))
                              else if (line.startsWith("☐ ")) addStyle(SpanStyle(color = mutedColor, fontSize = (baseFontSizeSp+2f).sp), ls, min(ls + 2, le))
                              else if (line.startsWith("☑ ")) {
                                  addStyle(SpanStyle(color = accentColor, fontSize = (baseFontSizeSp+2f).sp), ls, min(ls + 2, le))
                                  if (le > ls + 2) addStyle(SpanStyle(color = mutedColor, textDecoration = TextDecoration.LineThrough), ls + 2, le)
                              }
                          }
                          ls = le + 1; idx++
                      }
                      doc.spans.forEach { span ->
                          val s = span.start.coerceIn(0, text.length); val e = span.end.coerceIn(0, text.length)
                          if (e > s) {
                              if (span.bold) addStyle(SpanStyle(fontWeight = FontWeight.Bold), s, e)
                              if (span.italic) addStyle(SpanStyle(fontStyle = FontStyle.Italic), s, e)
                              if (!span.link.isNullOrBlank()) addStyle(SpanStyle(color = accentColor, textDecoration = TextDecoration.Underline), s, e)
                          }
                      }
                  }
                  return TransformedText(styled, OffsetMapping.Identity)
              }
          }

          fun formatRelativeDate(millis: Long): String {
              val diff = System.currentTimeMillis() - millis; val cN = Calendar.getInstance(); val cT = Calendar.getInstance().apply { timeInMillis = millis }
              return when {
                  diff < 60000L -> "Just now"
                  cN.get(Calendar.YEAR) == cT.get(Calendar.YEAR) && cN.get(Calendar.DAY_OF_YEAR) == cT.get(Calendar.DAY_OF_YEAR) -> SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date(millis))
                  cN.get(Calendar.YEAR) == cT.get(Calendar.YEAR) && cN.get(Calendar.DAY_OF_YEAR) - cT.get(Calendar.DAY_OF_YEAR) == 1 -> "Yesterday"
                  cN.get(Calendar.YEAR) == cT.get(Calendar.YEAR) -> SimpleDateFormat("MMM d", Locale.getDefault()).format(Date(millis))
                  else -> SimpleDateFormat("MMM d, yyyy", Locale.getDefault()).format(Date(millis))
              }
          }

