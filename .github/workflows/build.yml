name: Build Monolith Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Configs & Adaptive Vector Icon
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonolithNotes"
          include(":app")
          EOF

          printf "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n" > gradle.properties

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' | sed 's/^          //' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#121318"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M34,24L62,24L74,36L74,84L34,84Z"/>
              <path
                  android:fillColor="#121318"
                  android:pathData="M42,44h24v4h-24zM42,54h24v4h-24zM42,64h16v4h-16z"/>
          </vector>
          EOF

      - name: Ensure Valid Persistent Release Keystore
        run: |
          mkdir -p app
          if ! keytool -list -keystore app/keystore.jks -storepass monolithPass2026 -alias monolith_key >/dev/null 2>&1; then
            echo "Generating clean PKCS12 release keystore..."
            rm -f app/keystore.jks
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore app/keystore.jks \
              -alias monolith_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass monolithPass2026 \
              -keypass monolithPass2026 \
              -dname "CN=MonolithVault, OU=Mobile, O=MonolithLocal, L=Local, S=Local, C=IN"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/keystore.jks
            git commit -m "chore: persist valid PKCS12 android release keystore [skip ci]" || true
            git push || true
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK & Play Store Bundle
        run: |
          gradle assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk Monolith-Notes-Release.apk
          cp app/build/outputs/bundle/release/app-release.aab Monolith-Notes-PlayStore.aab

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-Notes-Android-Release
          path: |
            Monolith-Notes-Release.apk
            Monolith-Notes-PlayStore.aab
