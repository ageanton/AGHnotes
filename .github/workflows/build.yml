          enum class HeadingStyle(val label: String) { TEXT("Text"), SMALL("Small heading"), LARGE("Large heading") }
          enum class DrawingTool(val label: String, val alpha: Float) { PEN("Pen", 1.0f), MARKER("Marker", 0.85f), HIGHLIGHTER("Highlighter", 0.34f), ERASER("Eraser", 1.0f) }

          data class DrawPoint(val xDp: Float, val yDp: Float)
          data class DrawStroke(val tool: DrawingTool, val colorIndex: Int, val widthDp: Float, val points: List<DrawPoint>)

          val InkPaletteSwatches = listOf(
              Color(0xFF1F1F1D), Color(0xFF2563EB), Color(0xFFDC2626),
              Color(0xFF16A34A), Color(0xFFD97706), Color(0xFF7C3AED)
          )
          val SizePresetLabels = listOf("XS", "S", "M", "L", "XL")

          fun resolveInkColor(colorIndex: Int, adaptiveDefault: Color) = if (colorIndex in InkPaletteSwatches.indices) InkPaletteSwatches[colorIndex] else adaptiveDefault

          fun strokeWidthForTool(tool: DrawingTool, sizeIndex: Int): Float {
              val idx = sizeIndex.coerceIn(0, 4)
              return when (tool) {
                  DrawingTool.PEN -> floatArrayOf(1.4f, 2.4f, 4.0f, 6.5f, 10.0f)[idx]
                  DrawingTool.MARKER -> floatArrayOf(3.5f, 5.5f, 8.5f, 13.0f, 18.0f)[idx]
                  DrawingTool.HIGHLIGHTER -> floatArrayOf(10.0f, 14.0f, 20.0f, 26.0f, 34.0f)[idx]
                  DrawingTool.ERASER -> floatArrayOf(5.0f, 10.0f, 18.0f, 30.0f, 48.0f)[idx]
              }
          }

          fun interpolatePoints(from: DrawPoint, to: DrawPoint, stepDp: Float = 1.5f): List<DrawPoint> {
              val dist = hypot(to.xDp - from.xDp, to.yDp - from.yDp)
              if (dist <= stepDp) return listOf(to)
              val steps = ceil(dist / stepDp).toInt().coerceIn(1, 120)
              return (1..steps).map { i ->
                  val t = i.toFloat() / steps
                  DrawPoint(from.xDp + (to.xDp - from.xDp) * t, from.yDp + (to.yDp - from.yDp) * t)
              }
          }

          fun distancePointToSegmentDp(px: Float, py: Float, ax: Float, ay: Float, bx: Float, by: Float): Float {
              val lenSq = (bx - ax)*(bx - ax) + (by - ay)*(by - ay)
              if (lenSq <= 0.0001f) return hypot(px - ax, py - ay)
              val t = (((px - ax) * (bx - ax) + (py - ay) * (by - ay)) / lenSq).coerceIn(0f, 1f)
              return hypot(px - (ax + t * (bx - ax)), py - (ay + t * (by - ay)))
          }

          fun eraseStrokesAlongSegment(strokes: List<DrawStroke>, fromPt: DrawPoint, toPt: DrawPoint, eraserRadiusDp: Float): List<DrawStroke> {
              if (strokes.isEmpty()) return strokes
              val result = mutableListOf<DrawStroke>()
              var anyChanged = false
              for (stroke in strokes) {
                  val threshold = eraserRadiusDp + (stroke.widthDp * 0.45f)
                  val densePoints = mutableListOf<DrawPoint>()
                  stroke.points.forEach { pt ->
                      if (densePoints.isEmpty()) densePoints.add(pt)
                      else densePoints.addAll(interpolatePoints(densePoints.last(), pt, 2.0f))
                  }
                  if (!densePoints.any { distancePointToSegmentDp(it.xDp, it.yDp, fromPt.xDp, fromPt.yDp, toPt.xDp, toPt.yDp) <= threshold }) {
                      result.add(stroke)
                  } else {
                      anyChanged = true
                      var currentSegment = mutableListOf<DrawPoint>()
                      for (pt in densePoints) {
                          if (distancePointToSegmentDp(pt.xDp, pt.yDp, fromPt.xDp, fromPt.yDp, toPt.xDp, toPt.yDp) > threshold) {
                              currentSegment.add(pt)
                          } else if (currentSegment.isNotEmpty()) {
                              result.add(stroke.copy(points = currentSegment))
                              currentSegment = mutableListOf()
                          }
                      }
                      if (currentSegment.isNotEmpty()) result.add(stroke.copy(points = currentSegment))
                  }
              }
              return if (anyChanged) result else strokes
          }

          data class InlineStyleSpan(val start: Int, val end: Int, val bold: Boolean = false, val italic: Boolean = false, val link: String? = null)
          data class RichNoteDocument(
              val text: String = "", val spans: List<InlineStyleSpan> = emptyList(),
              val lineHeadings: Map<Int, HeadingStyle> = emptyMap(), val strokes: List<DrawStroke> = emptyList(), val canvasHeightDp: Int = 300
          ) {
              fun toPlainPreview(): String {
                  val preview = text.lines().map { it.removePrefix("• ").removePrefix("☐ ").removePrefix("☑ ").trim() }.filter { it.isNotEmpty() }.joinToString(" ")
                  return when {
                      preview.isNotEmpty() && strokes.isNotEmpty() -> "$preview  ·  Sketch"
                      preview.isNotEmpty() -> preview
                      strokes.isNotEmpty() -> "Handwritten sketch"
                      else -> ""
                  }
              }
              fun serialize(): String {
                  val spansArray = JSONArray()
                  spans.filter { it.end > it.start && (it.bold || it.italic || !it.link.isNullOrBlank()) }.forEach { span ->
                      spansArray.put(JSONObject().apply {
                          put("s", span.start); put("e", span.end); if (span.bold) put("b", true); if (span.italic) put("i", true); if (!span.link.isNullOrBlank()) put("l", span.link)
                      })
                  }
                  val headingsObj = JSONObject()
                  lineHeadings.forEach { (idx, style) -> if (style != HeadingStyle.TEXT) headingsObj.put(idx.toString(), style.name) }
                  val strokesArray = JSONArray()
                  strokes.filter { it.points.isNotEmpty() }.forEach { stroke ->
                      val ptsArray = JSONArray()
                      stroke.points.forEach { pt -> ptsArray.put(((pt.xDp * 10f).roundToInt() / 10f).toDouble()); ptsArray.put(((pt.yDp * 10f).roundToInt() / 10f).toDouble()) }
                      strokesArray.put(JSONObject().apply { put("t", stroke.tool.name); put("c", stroke.colorIndex); put("w", stroke.widthDp.toDouble()); put("p", ptsArray) })
                  }
                  return JSONObject().apply { put("_format", "rich_v2"); put("text", text); put("spans", spansArray); put("headings", headingsObj); put("strokes", strokesArray); put("canvasH", canvasHeightDp) }.toString()
              }
              companion object {
                  fun deserialize(rawContent: String): RichNoteDocument {
                      if (rawContent.isBlank()) return RichNoteDocument()
                      if (rawContent.startsWith("{")) {
                          try {
                              val obj = JSONObject(rawContent)
                              if (obj.optString("_format") == "rich_v2") {
                                  val spans = mutableListOf<InlineStyleSpan>()
                                  obj.optJSONArray("spans")?.let { arr ->
                                      for (i in 0 until arr.length()) {
                                          val sObj = arr.getJSONObject(i)
                                          val start = sObj.optInt("s", 0); val end = sObj.optInt("e", 0)
                                          if (end > start) spans.add(InlineStyleSpan(start, end, sObj.optBoolean("b"), sObj.optBoolean("i"), sObj.optString("l").ifBlank { null }))
                                      }
                                  }
                                  val headings = mutableMapOf<Int, HeadingStyle>()
                                  obj.optJSONObject("headings")?.let { hObj ->
                                      val keys = hObj.keys()
                                      while (keys.hasNext()) {
                                          val k = keys.next(); val idx = k.toIntOrNull() ?: continue
                                          val style = runCatching { HeadingStyle.valueOf(hObj.optString(k)) }.getOrDefault(HeadingStyle.TEXT)
                                          if (style != HeadingStyle.TEXT) headings[idx] = style
                                      }
                                  }
                                  val strokes = mutableListOf<DrawStroke>()
                                  obj.optJSONArray("strokes")?.let { arr ->
                                      for (i in 0 until arr.length()) {
                                          val stObj = arr.getJSONObject(i)
                                          val pts = mutableListOf<DrawPoint>()
                                          stObj.optJSONArray("p")?.let { pArr ->
                                              for (j in 0 until pArr.length() step 2) pts.add(DrawPoint(pArr.optDouble(j).toFloat(), pArr.optDouble(j+1).toFloat()))
                                          }
                                          if (pts.isNotEmpty()) strokes.add(DrawStroke(runCatching { DrawingTool.valueOf(stObj.optString("t")) }.getOrDefault(DrawingTool.PEN), stObj.optInt("c"), stObj.optDouble("w").toFloat(), pts))
                                      }
                                  }
                                  return RichNoteDocument(obj.optString("text", ""), spans, headings, strokes, obj.optInt("canvasH", 300))
                              }
                          } catch (_: Exception) {}
                      }
                      return RichNoteDocument()
                  }
              }
          }

          data class Note(val id: String = UUID.randomUUID().toString(), val title: String, val document: RichNoteDocument, val folder: String = "", val isPinned: Boolean = false, val isTrashed: Boolean = false, val createdAt: Long = System.currentTimeMillis(), val updatedAt: Long = System.currentTimeMillis()) {
              val previewText: String get() = document.toPlainPreview()
          }

          fun normalizeFolderPath(path: String) = path.split("/").map { it.trim() }.filter { it.isNotEmpty() }.joinToString("/")
          fun parentFolderPath(path: String) = normalizeFolderPath(path).let { val i = it.lastIndexOf('/'); if (i == -1) "" else it.substring(0, i) }
          fun folderDisplayName(path: String) = normalizeFolderPath(path).let { val i = it.lastIndexOf('/'); if (i == -1) it else it.substring(i + 1) }
          fun expandAllFolderPaths(rawPaths: Collection<String>): List<String> {
              val set = linkedSetOf<String>()
              rawPaths.forEach { raw ->
                  var cur = ""
                  raw.split("/").map { it.trim() }.filter { it.isNotEmpty() }.forEach { part -> cur = if (cur.isEmpty()) part else "$cur/$part"; set.add(cur) }
              }
              return set.toList().sortedBy { it.lowercase() }
          }
          fun directSubfoldersOf(parentPath: String, allFolders: List<String>): List<String> {
              val norm = normalizeFolderPath(parentPath)
              return allFolders.filter { parentFolderPath(it).equals(norm, ignoreCase = true) && !it.equals(norm, ignoreCase = true) }.sortedBy { folderDisplayName(it).lowercase() }
          }

          data class EditorSnapshot(val title: String, val document: RichNoteDocument, val selection: TextRange, val timestamp: Long = System.currentTimeMillis())
          class SessionUndoQueue(initialSnapshot: EditorSnapshot) {
              val undoStack = mutableStateListOf(initialSnapshot)
              val redoStack = mutableStateListOf<EditorSnapshot>()
              val canUndo: Boolean get() = undoStack.size > 1
              val canRedo: Boolean get() = redoStack.isNotEmpty()
              fun recordChange(snapshot: EditorSnapshot, forceNewStep: Boolean = false) {
                  val current = undoStack.lastOrNull()
                  if (current?.title == snapshot.title && current.document == snapshot.document) return
                  redoStack.clear()
                  if (!forceNewStep && current != null && undoStack.size > 1 && snapshot.timestamp - current.timestamp < 1100L &&
                      abs(snapshot.document.text.length - current.document.text.length) <= 12 && snapshot.document.text.count { it == '\n' } == current.document.text.count { it == '\n' } &&
                      snapshot.document.strokes.size == current.document.strokes.size && current.document.lineHeadings == snapshot.document.lineHeadings
                  ) { undoStack[undoStack.lastIndex] = snapshot; return }
                  undoStack.add(snapshot)
                  while (undoStack.size > 30) undoStack.removeAt(0)
              }
              fun undo(): EditorSnapshot? { if (!canUndo) return null; redoStack.add(undoStack.removeAt(undoStack.lastIndex)); return undoStack.last() }
              fun redo(): EditorSnapshot? { if (!canRedo) return null; val r = redoStack.removeAt(redoStack.lastIndex); undoStack.add(r); return r }
          }

          class NotesDatabase(context: Context) : SQLiteOpenHelper(context, "monolith_vault.db", null, 2) {
              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE IF NOT EXISTS notes (id TEXT PRIMARY KEY, title TEXT NOT NULL, content TEXT NOT NULL, folder TEXT NOT NULL, tags TEXT NOT NULL, color_index INTEGER NOT NULL, is_pinned INTEGER NOT NULL, is_locked INTEGER NOT NULL, is_trashed INTEGER NOT NULL, created_at INTEGER NOT NULL, updated_at INTEGER NOT NULL)")
              }
              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) { onCreate(db); performRoutineMaintenance(db) }
              override fun onOpen(db: SQLiteDatabase) { super.onOpen(db); if (!db.isReadOnly) performRoutineMaintenance(db) }
              
              private fun performRoutineMaintenance(db: SQLiteDatabase) {
                  try {
                      db.execSQL("DELETE FROM notes WHERE title IN ('Welcome to Monolith Vault', 'Zero-Cloud Architecture', 'Quick Capture Scratchpad')")
                      db.execSQL("UPDATE notes SET folder = '' WHERE folder = 'Notes'")
                      val thirtyDaysAgo = System.currentTimeMillis() - (30L * 24 * 60 * 60 * 1000)
                      db.execSQL("DELETE FROM notes WHERE is_trashed = 1 AND updated_at < $thirtyDaysAgo")
                  } catch (_: Exception) {}
              }
              fun upsertNote(note: Note) {
                  try {
                      val values = ContentValues().apply { put("id", note.id); put("title", note.title); put("content", note.document.serialize()); put("folder", normalizeFolderPath(note.folder)); put("tags", ""); put("color_index", 0); put("is_pinned", if(note.isPinned) 1 else 0); put("is_locked", 0); put("is_trashed", if(note.isTrashed) 1 else 0); put("created_at", note.createdAt); put("updated_at", note.updatedAt) }
                      writableDatabase.insertWithOnConflict("notes", null, values, SQLiteDatabase.CONFLICT_REPLACE)
                  } catch (_: Exception) {}
              }
              fun permanentDeleteNote(id: String) { try { writableDatabase.delete("notes", "id = ?", arrayOf(id)) } catch (_: Exception) {} }
              fun emptyTrash() { try { writableDatabase.delete("notes", "is_trashed = 1", null) } catch (_: Exception) {} }
              fun clearFolderFromNotes(folderName: String) { try { writableDatabase.update("notes", ContentValues().apply { put("folder", "") }, "folder = ?", arrayOf(folderName)) } catch (_: Exception) {} }
              fun renameFolderTree(oldPath: String, newPath: String) {
                  val normOld = normalizeFolderPath(oldPath); val normNew = normalizeFolderPath(newPath)
                  if (normOld.isEmpty() || normNew.isEmpty()) return
                  getAllNotes(includeTrashed = false).forEach { note ->
                      val nf = normalizeFolderPath(note.folder)
                      if (nf.equals(normOld, ignoreCase=true)) upsertNote(note.copy(folder = normNew))
                      else if (nf.startsWith("$normOld/", ignoreCase=true)) upsertNote(note.copy(folder = normNew + nf.substring(normOld.length)))
                  }
              }
              fun removeFolderTreeMoveNotesToParent(targetPath: String) {
                  val normTarget = normalizeFolderPath(targetPath); val parent = parentFolderPath(normTarget)
                  getAllNotes(includeTrashed = false).forEach { note ->
                      val nf = normalizeFolderPath(note.folder)
                      if (nf.equals(normTarget, ignoreCase=true) || nf.startsWith("$normTarget/", ignoreCase=true)) upsertNote(note.copy(folder = parent))
                  }
              }
              fun getAllNotes(includeTrashed: Boolean = false): List<Note> {
                  val list = mutableListOf<Note>()
                  try {
                      val cursor = readableDatabase.query("notes", null, if (includeTrashed) "is_trashed = 1" else "is_trashed = 0", null, null, null, "updated_at DESC")
                      cursor.use { c ->
                          while (c.moveToNext()) {
                              list.add(Note(
                                  id = c.getString(c.getColumnIndexOrThrow("id")), title = c.getString(c.getColumnIndexOrThrow("title")),
                                  document = RichNoteDocument.deserialize(c.getString(c.getColumnIndexOrThrow("content"))),
                                  folder = normalizeFolderPath(c.getString(c.getColumnIndexOrThrow("folder"))),
                                  isPinned = c.getInt(c.getColumnIndexOrThrow("is_pinned")) == 1,
                                  isTrashed = c.getInt(c.getColumnIndexOrThrow("is_trashed")) == 1,
                                  createdAt = c.getLong(c.getColumnIndexOrThrow("created_at")), updatedAt = c.getLong(c.getColumnIndexOrThrow("updated_at"))
                              ))
                          }
                      }
                  } catch (_: Exception) {}
                  return list
              }
          }

          fun loadSavedFolders(prefs: SharedPreferences): List<String> {
              return try { val arr = JSONArray(prefs.getString("custom_folders_json", "[]")); expandAllFolderPaths((0 until arr.length()).map { normalizeFolderPath(arr.optString(it)) }) } catch (_: Exception) { emptyList() }
          }
          fun saveFoldersList(prefs: SharedPreferences, folders: List<String>) {
