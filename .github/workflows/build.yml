                                              Box(Modifier.size(25.dp).clip(CircleShape).background(if(idx==0) MaterialTheme.colorScheme.onBackground else sw).border(if(a) 2.5.dp else 1.dp, if(a) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.outline, CircleShape).clickable{sCIdx=idx})
                                          }
                                      }
                                  } else Text("Eraser size:", fontSize=12.sp, color=MaterialTheme.colorScheme.onSurfaceVariant)
                                  Row(horizontalArrangement=Arrangement.spacedBy(6.dp), verticalAlignment=Alignment.CenterVertically) {
                                      val cTSI = if(sTl == DrawingTool.ERASER) eSIdx else pSIdx
                                      SizePresetLabels.forEachIndexed { idx, l ->
                                          val a = cTSI == idx
                                          Surface(color=if(a) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.surfaceVariant, shape=RoundedCornerShape(8.dp), modifier=Modifier.height(28.dp).defaultMinSize(minWidth=30.dp).clip(RoundedCornerShape(8.dp)).clickable{if(sTl==DrawingTool.ERASER) eSIdx=idx else pSIdx=idx}) { Box(Alignment.Center, Modifier.padding(horizontal=7.dp)) { Text(l, fontSize=11.sp, fontWeight=FontWeight.SemiBold, color=if(a) MaterialTheme.colorScheme.onPrimary else MaterialTheme.colorScheme.onSurfaceVariant) } }
                                      }
                                  }
                              }
                          }
                      }
                  }
                  AnimatedVisibility(iTVis, enter=slideInVertically({it})+fadeIn(), exit=slideOutVertically({it})+fadeOut()) {
                      Box(Modifier.fillMaxWidth().background(MaterialTheme.colorScheme.surface).padding(vertical=6.dp), Alignment.Center) {
                          var sme by remember { mutableStateOf(false) }
                          Row(Modifier.widthIn(max=560.dp).horizontalScroll(rememberScrollState()).padding(horizontal=16.dp), verticalAlignment=Alignment.CenterVertically, horizontalArrangement=Arrangement.spacedBy(6.dp)) {
                              Box {
                                  Surface(color=MaterialTheme.colorScheme.surfaceVariant, shape=RoundedCornerShape(8.dp), modifier=Modifier.clip(RoundedCornerShape(8.dp)).clickable{sme=true}) { Row(Modifier.padding(12.dp, 7.dp), verticalAlignment=Alignment.CenterVertically) { Text(cHS.label, fontSize=13.sp, fontWeight=FontWeight.Medium, color=MaterialTheme.colorScheme.onSurface); Spacer(Modifier.width(4.dp)); Icon(Icons.Default.ArrowDropDown, null, Modifier.size(18.dp), tint=MaterialTheme.colorScheme.onSurfaceVariant) } }
                                  DropdownMenu(sme, {sme=false}, shape=RoundedCornerShape(12.dp), containerColor=MaterialTheme.colorScheme.surface) {
                                      DropdownMenuItem({ Text("Text", fontSize=15.sp, fontWeight=FontWeight.Normal) }, { sme=false; val hm = d.lineHeadings.toMutableMap(); hm.remove(cLI); val nD = d.copy(lineHeadings=hm); d=nD; tIS(nD, forceNewUndoStep=true) })
                                      DropdownMenuItem({ Text("Small heading", fontSize=17.sp, fontWeight=FontWeight.SemiBold) }, { sme=false; val hm = d.lineHeadings.toMutableMap(); hm[cLI] = HeadingStyle.SMALL; val nD = d.copy(lineHeadings=hm); d=nD; tIS(nD, forceNewUndoStep=true) })
                                      DropdownMenuItem({ Text("Large heading", fontSize=20.sp, fontWeight=FontWeight.SemiBold) }, { sme=false; val hm = d.lineHeadings.toMutableMap(); hm[cLI] = HeadingStyle.LARGE; val nD = d.copy(lineHeadings=hm); d=nD; tIS(nD, forceNewUndoStep=true) })
                                  }
                              }
                              Surface(color=if(iSB) MaterialTheme.colorScheme.primary else Color.Transparent, shape=RoundedCornerShape(8.dp), modifier=Modifier.size(36.dp).clip(RoundedCornerShape(8.dp)).clickable{ if(!tfv.selection.collapsed) { val nD = toggleSelectionInlineStyle(d, tfv.selection, toggleBold=true); d=nD; tIS(nD, forceNewUndoStep=true) } else aB = !aB }) { Box(Alignment.Center) { Icon(Icons.Default.FormatBold, null, tint=if(iSB) MaterialTheme.colorScheme.onPrimary else MaterialTheme.colorScheme.onSurface, modifier=Modifier.size(20.dp)) } }
                              Surface(color=if(iSI) MaterialTheme.colorScheme.primary else Color.Transparent, shape=RoundedCornerShape(8.dp), modifier=Modifier.size(36.dp).clip(RoundedCornerShape(8.dp)).clickable{ if(!tfv.selection.collapsed) { val nD = toggleSelectionInlineStyle(d, tfv.selection, toggleItalic=true); d=nD; tIS(nD, forceNewUndoStep=true) } else aI = !aI }) { Box(Alignment.Center) { Icon(Icons.Default.FormatItalic, null, tint=if(iSI) MaterialTheme.colorScheme.onPrimary else MaterialTheme.colorScheme.onSurface, modifier=Modifier.size(20.dp)) } }
                              Surface(color=Color.Transparent, shape=RoundedCornerShape(8.dp), modifier=Modifier.size(36.dp).clip(RoundedCornerShape(8.dp)).clickable{tLP("• ")}) { Box(Alignment.Center) { Icon(Icons.AutoMirrored.Filled.FormatListBulleted, null, tint=MaterialTheme.colorScheme.onSurface, modifier=Modifier.size(20.dp)) } }
                              Surface(color=Color.Transparent, shape=RoundedCornerShape(8.dp), modifier=Modifier.size(36.dp).clip(RoundedCornerShape(8.dp)).clickable{tLP("☐ ")}) { Box(Alignment.Center) { Icon(Icons.Default.CheckBox, null, tint=MaterialTheme.colorScheme.onSurface, modifier=Modifier.size(20.dp)) } }
                              Surface(color=Color.Transparent, shape=RoundedCornerShape(8.dp), modifier=Modifier.size(36.dp).clip(RoundedCornerShape(8.dp)).clickable{sL=true}) { Box(Alignment.Center) { Icon(Icons.Default.Link, null, tint=MaterialTheme.colorScheme.onSurface, modifier=Modifier.size(20.dp)) } }
                          }
                      }
                  }
              }
              if (sL) InsertLinkDialog(if(!tfv.selection.collapsed) tfv.text.substring(tfv.selection.min, tfv.selection.max) else "", {sL=false}) { l, u -> val r = tfv.text; val iss = tfv.selection.min.coerceIn(0, r.length); val ie = tfv.selection.max.coerceIn(0, r.length); val dL = l.ifBlank{u}; val nT = r.substring(0, iss) + dL + r.substring(ie); val aD = adjustDocumentOnEdit(d, nT, false, false); val nD = aD.copy(spans = normalizeSpans(aD.spans + InlineStyleSpan(iss, iss + dL.length, link = u), nT.length)); val nS = TextRange(iss + dL.length); d=nD; tfv=TextFieldValue(nT, nS); tIS(nD, selection=nS, forceNewUndoStep=true); sL=false }
          }

          @Composable
          fun TrashBinScreen(db: NotesDatabase, onBack: () -> Unit) {
              var tN by remember { mutableStateOf(db.getAllNotes(true)) }
              var showEmptyDialog by remember { mutableStateOf(false) }
              Column(Modifier.fillMaxSize()) {
                  Row(Modifier.fillMaxWidth().padding(8.dp, 6.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                      IconButton(onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, null, tint = MaterialTheme.colorScheme.onBackground) }
                      Text("Trash Bin", fontSize = 20.sp, fontWeight = FontWeight.SemiBold, color = MaterialTheme.colorScheme.onBackground)
                      if (tN.isNotEmpty()) TextButton({ showEmptyDialog = true }) { Text("Empty", color = MaterialTheme.colorScheme.error) } else Spacer(Modifier.width(48.dp))
                  }
                  if (tN.isEmpty()) Box(Modifier.fillMaxSize(), Alignment.Center) { Text("Trash is empty.", fontSize = 16.sp, color = MaterialTheme.colorScheme.onSurfaceVariant) }
                  else LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(16.dp, 8.dp)) {
                      item { Text("Items in the trash will be permanently deleted after 30 days.", fontSize=13.sp, color=MaterialTheme.colorScheme.onSurfaceVariant, modifier=Modifier.padding(bottom=16.dp)) }
                      items(tN, key = { it.id }) { n ->
                          val daysLeft = max(0, 30 - ((System.currentTimeMillis() - n.updatedAt) / (1000 * 60 * 60 * 24)).toInt())
                          Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(8.dp)).background(MaterialTheme.colorScheme.surfaceVariant.copy(alpha=0.5f)).padding(12.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                              Column(Modifier.weight(1f).padding(end=12.dp)) {
                                  Text(n.title.ifBlank { "Untitled" }, fontSize=16.sp, fontWeight=FontWeight.SemiBold, color=MaterialTheme.colorScheme.onSurface, maxLines=1, overflow=TextOverflow.Ellipsis)
                                  Spacer(Modifier.height(4.dp))
                                  Text("$daysLeft days left  ·  From ${if(n.folder.isEmpty()) "Folio" else folderDisplayName(n.folder)}", fontSize=13.sp, color=MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                              TextButton({ db.upsertNote(n.copy(isTrashed = false, updatedAt = System.currentTimeMillis())); tN = db.getAllNotes(true) }) { Text("Restore") }
                          }
                          Spacer(Modifier.height(8.dp))
                      }
                  }
              }
              if (showEmptyDialog) AlertDialog(onDismissRequest = { showEmptyDialog = false }, shape = RoundedCornerShape(14.dp), containerColor = MaterialTheme.colorScheme.surface, title = { Text("Empty Trash?", fontSize=18.sp, fontWeight=FontWeight.SemiBold) }, text = { Text("All items will be permanently deleted.", fontSize=15.sp, color=MaterialTheme.colorScheme.onSurfaceVariant) }, confirmButton = { TextButton({ db.emptyTrash(); tN = emptyList(); showEmptyDialog = false }) { Text("Empty", color=MaterialTheme.colorScheme.error, fontWeight=FontWeight.SemiBold) } }, dismissButton = { TextButton({ showEmptyDialog = false }) { Text("Cancel") } })
          }

          @Composable
          fun SettingsDialog(isDarkTheme: Boolean, onToggleDarkTheme: (Boolean) -> Unit, fontScaleIndex: Int, onSelectFontScale: (Int) -> Unit, onOpenTrash: () -> Unit, onDismiss: () -> Unit) {
              AlertDialog(onDismissRequest = onDismiss, shape = RoundedCornerShape(14.dp), containerColor = MaterialTheme.colorScheme.surface, title = { Text("Settings", fontSize = 18.sp, fontWeight = FontWeight.SemiBold) }, text = {
                  Column(verticalArrangement = Arrangement.spacedBy(18.dp)) {
                      Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) { Column { Text("Dark appearance", fontSize = 15.sp, fontWeight = FontWeight.Medium, color = MaterialTheme.colorScheme.onSurface); Text("Use a dark writing canvas", fontSize=13.sp, color=MaterialTheme.colorScheme.onSurfaceVariant) }; Switch(isDarkTheme, onToggleDarkTheme) }
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) { Text("Reading & writing text size", fontSize = 15.sp, fontWeight = FontWeight.Medium, color = MaterialTheme.colorScheme.onSurface); Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { listOf("Small", "Default", "Large").forEachIndexed { idx, label -> FilterChip(fontScaleIndex == idx, { onSelectFontScale(idx) }, label = { Text(label) }) } } }
                      HorizontalDivider(color = MaterialTheme.colorScheme.outline.copy(alpha=0.5f))
                      Text("Manage Trash Bin", fontSize = 15.sp, color = MaterialTheme.colorScheme.error, modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(8.dp)).clickable { onOpenTrash() }.padding(vertical = 8.dp))
                  }
              }, confirmButton = { TextButton(onDismiss) { Text("Done", fontWeight = FontWeight.SemiBold) } })
          }

          @Composable fun NewFolderDialog(parentFolderPath: String, onDismiss: () -> Unit, onConfirm: (String) -> Unit) { var f by remember { mutableStateOf("") }; AlertDialog(onDismissRequest = onDismiss, shape = RoundedCornerShape(14.dp), containerColor = MaterialTheme.colorScheme.surface, title = { Text(if (parentFolderPath.isEmpty()) "New folder" else "New folder in “${folderDisplayName(parentFolderPath)}”", fontSize = 18.sp, fontWeight = FontWeight.SemiBold) }, text = { OutlinedTextField(f, { f = it }, placeholder = { Text("Folder name") }, singleLine = true, shape = RoundedCornerShape(10.dp), modifier = Modifier.fillMaxWidth()) }, confirmButton = { TextButton(onClick = { onConfirm(f) }, enabled = f.trim().isNotEmpty()) { Text("Create", fontWeight = FontWeight.SemiBold) } }, dismissButton = { TextButton(onDismiss) { Text("Cancel") } }) }
          @Composable fun RenameFolderDialog(currentName: String, onDismiss: () -> Unit, onConfirm: (String) -> Unit) { var f by remember { mutableStateOf(currentName) }; AlertDialog(onDismissRequest = onDismiss, shape = RoundedCornerShape(14.dp), containerColor = MaterialTheme.colorScheme.surface, title = { Text("Rename folder", fontSize = 18.sp, fontWeight = FontWeight.SemiBold) }, text = { OutlinedTextField(f, { f = it }, placeholder = { Text("Folder name") }, singleLine = true, shape = RoundedCornerShape(10.dp), modifier = Modifier.fillMaxWidth()) }, confirmButton = { TextButton(onClick = { onConfirm(f) }, enabled = f.trim().isNotEmpty()) { Text("Save", fontWeight = FontWeight.SemiBold) } }, dismissButton = { TextButton(onDismiss) { Text("Cancel") } }) }
          @Composable fun DeleteFolderDialog(folderName: String, onDismiss: () -> Unit, onConfirmDelete: () -> Unit) { AlertDialog(onDismissRequest = onDismiss, shape = RoundedCornerShape(14.dp), containerColor = MaterialTheme.colorScheme.surface, title = { Text("Delete folder?", fontSize = 18.sp, fontWeight = FontWeight.SemiBold) }, text = { Text("“$folderName” will be removed. Any notes inside it will be moved up safely.", fontSize = 15.sp, color = MaterialTheme.colorScheme.onSurfaceVariant) }, confirmButton = { TextButton(onConfirmDelete) { Text("Delete", color = MaterialTheme.colorScheme.error, fontWeight = FontWeight.SemiBold) } }, dismissButton = { TextButton(onDismiss) { Text("Cancel") } }) }
          @Composable fun RenameNoteDialog(initialTitle: String, onDismiss: () -> Unit, onConfirm: (String) -> Unit) { var t by remember { mutableStateOf(initialTitle) }; AlertDialog(onDismissRequest = onDismiss, shape = RoundedCornerShape(14.dp), containerColor = MaterialTheme.colorScheme.surface, title = { Text("Rename note", fontSize = 18.sp, fontWeight = FontWeight.SemiBold) }, text = { OutlinedTextField(t, { t = it }, placeholder = { Text("Note title") }, singleLine = true, shape = RoundedCornerShape(10.dp), modifier = Modifier.fillMaxWidth()) }, confirmButton = { TextButton(onClick = { onConfirm(t) }) { Text("Save", fontWeight = FontWeight.SemiBold) } }, dismissButton = { TextButton(onDismiss) { Text("Cancel") } }) }
          @Composable fun MoveToFolderDialog(currentFolder: String, folders: List<String>, onDismiss: () -> Unit, onSelectFolder: (String) -> Unit, onCreateNewFolder: () -> Unit) { AlertDialog(onDismissRequest = onDismiss, shape = RoundedCornerShape(14.dp), containerColor = MaterialTheme.colorScheme.surface, title = { Text("Move to folder", fontSize = 18.sp, fontWeight = FontWeight.SemiBold) }, text = { Column(Modifier.verticalScroll(rememberScrollState()), Arrangement.spacedBy(4.dp)) { Surface(color = if (currentFolder.isBlank()) MaterialTheme.colorScheme.surfaceVariant else Color.Transparent, shape = RoundedCornerShape(8.dp), modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(8.dp)).clickable { onSelectFolder("") }) { Text("Folio (Home)", fontSize=15.sp, fontWeight=if(currentFolder.isBlank()) FontWeight.SemiBold else FontWeight.Normal, modifier=Modifier.padding(12.dp, 10.dp)) }; folders.forEach { f -> val d = f.count { it == '/' }; val s = currentFolder.equals(f, true); Surface(color = if (s) MaterialTheme.colorScheme.surfaceVariant else Color.Transparent, shape = RoundedCornerShape(8.dp), modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(8.dp)).clickable { onSelectFolder(f) }) { Row(Alignment.CenterVertically, Modifier.padding(start=(12+d*16).dp, end=12.dp, top=10.dp, bottom=10.dp)) { Icon(Icons.Outlined.Folder, null, tint=MaterialTheme.colorScheme.onSurfaceVariant, modifier=Modifier.size(16.dp)); Spacer(Modifier.width(8.dp)); Text(folderDisplayName(f), fontSize=15.sp, fontWeight=if(s) FontWeight.SemiBold else FontWeight.Normal) } } }; Spacer(Modifier.height(6.dp)); TextButton(onCreateNewFolder) { Icon(Icons.Default.Add, null, Modifier.size(16.dp)); Spacer(Modifier.width(6.dp)); Text("New folder") } } }, confirmButton = { TextButton(onDismiss) { Text("Close") } }) }
          @Composable fun InsertLinkDialog(initialLabel: String, onDismiss: () -> Unit, onInsertLink: (String, String) -> Unit) { var l by remember { mutableStateOf(initialLabel) }; var u by remember { mutableStateOf("") }; AlertDialog(onDismissRequest = onDismiss, shape = RoundedCornerShape(14.dp), containerColor = MaterialTheme.colorScheme.surface, title = { Text("Add link", fontSize = 18.sp, fontWeight = FontWeight.SemiBold) }, text = { Column(verticalArrangement = Arrangement.spacedBy(10.dp)) { OutlinedTextField(l, { l = it }, label = { Text("Text") }, singleLine = true, shape = RoundedCornerShape(10.dp), modifier = Modifier.fillMaxWidth()); OutlinedTextField(u, { u = it }, label = { Text("Link destination") }, placeholder = { Text("https://example.com") }, singleLine = true, shape = RoundedCornerShape(10.dp), modifier = Modifier.fillMaxWidth()) } }, confirmButton = { TextButton(onClick = { onInsertLink(l.trim(), u.trim()) }, enabled = u.isNotBlank() || l.isNotBlank()) { Text("Insert", fontWeight = FontWeight.SemiBold) } }, dismissButton = { TextButton(onDismiss) { Text("Cancel") } }) }
          EOF

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Folio-Notes.apk

      - name: Upload Finished Folio App
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Notes-App
          path: Folio-Notes.apk
