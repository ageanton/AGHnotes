          @Composable
          fun NotesApp(
              db: NotesDatabase,
              prefs: SharedPreferences,
              initialOpenNoteId: String?,
              isDarkTheme: Boolean,
              onToggleDarkTheme: (Boolean) -> Unit,
              fontScaleIndex: Int,
              onSelectFontScale: (Int) -> Unit,
              baseFontSizeSp: Float
          ) {
              val context = LocalContext.current
              val palette = LocalFolioPalette.current
              val scope = rememberCoroutineScope()
              val snackbarHostState = remember { SnackbarHostState() }

              var notes by remember { mutableStateOf(db.getActiveNotes()) }
              var trashedNotes by remember { mutableStateOf(db.getTrashedNotes()) }
              var customFolders by remember { mutableStateOf(loadSavedFolders(prefs)) }
              var currentFolderPath by remember { mutableStateOf("") }
              var activeNoteId by remember { mutableStateOf(initialOpenNoteId) }
              var isViewingTrash by remember { mutableStateOf(false) }
              var searchQuery by remember { mutableStateOf("") }

              val sessionUndoMap = remember { mutableMapOf<String, SessionUndoQueue>() }

              var noteToRename by remember { mutableStateOf<Note?>(null) }
              var noteToDelete by remember { mutableStateOf<Note?>(null) }
              var noteToMoveFolder by remember { mutableStateOf<Note?>(null) }
              var showNewFolderDialog by remember { mutableStateOf(false) }
              var folderToRename by remember { mutableStateOf<String?>(null) }
              var folderToDelete by remember { mutableStateOf<String?>(null) }
              var showSettingsDialog by remember { mutableStateOf(false) }

              val allFolders = remember(customFolders, notes) {
                  val fromNotes = notes.map { normalizeFolderPath(it.folder) }.filter { it.isNotEmpty() }
                  expandAllFolderPathsPreservingOrder(customFolders + fromNotes)
              }

              val folderColorMap = remember(allFolders) {
                  ensureFolderColorsAssigned(prefs, allFolders)
              }

              fun refreshNotes() {
                  notes = db.getActiveNotes()
                  trashedNotes = db.getTrashedNotes()
              }

              fun handleMoveToTrashWithUndo(target: Note) {
                  cancelNoteReminderAlarm(context, target.id)
                  db.moveToTrash(target)
                  if (activeNoteId == target.id) activeNoteId = null
                  refreshNotes()
                  scope.launch {
                      snackbarHostState.currentSnackbarData?.dismiss()
                      val result = snackbarHostState.showSnackbar(
                          message = "Moved to Trash (kept for 30 days)",
                          actionLabel = "Undo",
                          duration = SnackbarDuration.Short
                      )
                      if (result == SnackbarResult.ActionPerformed) {
                          db.restoreFromTrash(target)
                          target.document.reminderAt?.let { remTime ->
                              if (remTime > System.currentTimeMillis()) {
                                  scheduleNoteReminderAlarm(context, target, remTime)
                              }
                          }
                          refreshNotes()
                      }
                  }
              }

              val activeNote = remember(notes, activeNoteId) {
                  activeNoteId?.let { id -> notes.firstOrNull { it.id == id } }
              }

              Scaffold(
                  snackbarHost = {
                      SnackbarHost(hostState = snackbarHostState) { data ->
                          Snackbar(
                              snackbarData = data,
                              shape = RoundedCornerShape(12.dp),
                              containerColor = palette.primaryText,
                              contentColor = palette.screenBg,
                              actionColor = palette.screenBg
                          )
                      }
                  },
                  containerColor = palette.screenBg,
                  contentWindowInsets = WindowInsets(0, 0, 0, 0)
              ) { rootPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(rootPadding)
                  ) {
                      when {
                          activeNote != null -> {
                              val undoQueue = remember(activeNote.id) {
                                  sessionUndoMap.getOrPut(activeNote.id) {
                                      SessionUndoQueue(
                                          EditorSnapshot(
                                              title = activeNote.title,
                                              document = activeNote.document,
                                              selection = TextRange(activeNote.document.text.length)
                                          )
                                      )
                                  }
                              }

                              NoteEditorScreen(
                                  note = activeNote,
                                  prefs = prefs,
                                  undoQueue = undoQueue,
                                  baseFontSizeSp = baseFontSizeSp,
                                  hasFolders = allFolders.isNotEmpty(),
                                  onAutoSave = { updated ->
                                      db.upsertNote(updated)
                                      refreshNotes()
                                  },
                                  onBack = {
                                      refreshNotes()
                                      activeNoteId = null
                                  },
                                  onTogglePin = { current ->
                                      val updated = current.copy(
                                          isPinned = !current.isPinned,
                                          updatedAt = System.currentTimeMillis()
                                      )
                                      db.upsertNote(updated)
                                      refreshNotes()
                                  },
                                  onRequestRename = { current -> noteToRename = current },
                                  onRequestMoveFolder = { current -> noteToMoveFolder = current },
                                  onRequestDelete = { current -> noteToDelete = current }
                              )
                          }
                          isViewingTrash -> {
                              TrashScreen(
                                  trashedNotes = trashedNotes,
                                  onBack = { isViewingTrash = false },
                                  onRestoreNote = { note ->
                                      db.restoreFromTrash(note)
                                      refreshNotes()
                                      scope.launch {
                                          snackbarHostState.currentSnackbarData?.dismiss()
                                          snackbarHostState.showSnackbar(
                                              message = "Note restored",
                                              duration = SnackbarDuration.Short
                                          )
                                      }
                                  },
                                  onDeleteForever = { note ->
                                      cancelNoteReminderAlarm(context, note.id)
                                      db.deleteNotePermanently(note.id)
                                      refreshNotes()
                                  },
                                  onEmptyTrash = {
                                      trashedNotes.forEach { cancelNoteReminderAlarm(context, it.id) }
                                      db.emptyTrashPermanently()
                                      refreshNotes()
                                  }
                              )
                          }
                          else -> {
                              NotesHomeScreen(
                                  notes = notes,
                                  allFolders = allFolders,
                                  folderColorMap = folderColorMap,
                                  currentFolderPath = currentFolderPath,
                                  onNavigateFolder = { targetPath ->
                                      currentFolderPath = normalizeFolderPath(targetPath)
                                  },
                                  onRequestRenameFolder = { folderPath -> folderToRename = folderPath },
                                  onRequestDeleteFolder = { folderPath -> folderToDelete = folderPath },
                                  searchQuery = searchQuery,
                                  onSearchQueryChange = { searchQuery = it },
                                  onOpenNote = { note -> activeNoteId = note.id },
                                  onCreateNote = {
                                      val fresh = Note(
                                          title = "",
                                          document = RichNoteDocument(),
                                          folder = currentFolderPath
                                      )
                                      db.upsertNote(fresh)
                                      refreshNotes()
                                      activeNoteId = fresh.id
                                  },
                                  onRequestCreateFolder = { showNewFolderDialog = true },
                                  onTogglePin = { note ->
                                      val updated = note.copy(
                                          isPinned = !note.isPinned,
                                          updatedAt = System.currentTimeMillis()
                                      )
                                      db.upsertNote(updated)
                                      refreshNotes()
                                  },
                                  onRequestRename = { note -> noteToRename = note },
                                  onRequestMoveFolder = { note -> noteToMoveFolder = note },
                                  onRequestDelete = { note -> noteToDelete = note },
                                  onOpenSettings = { showSettingsDialog = true }
                              )
                          }
                      }
                  }
              }

              if (showNewFolderDialog) {
                  NewFolderDialog(
                      parentFolderPath = currentFolderPath,
                      onDismiss = { showNewFolderDialog = false },
                      onConfirm = { rawName ->
                          val cleanName = rawName.trim().replace("/", "-")
                          if (cleanName.isNotEmpty()) {
                              val fullPath = if (currentFolderPath.isEmpty()) cleanName else "$currentFolderPath/$cleanName"
                              val updated = expandAllFolderPathsPreservingOrder(customFolders + fullPath)
                              customFolders = updated
                              saveFoldersList(prefs, updated)
                              ensureFolderColorsAssigned(prefs, updated)
                          }
                          showNewFolderDialog = false
                      }
                  )
              }

              if (folderToRename != null) {
                  val targetFolder = folderToRename!!
                  RenameFolderDialog(
                      currentName = folderDisplayName(targetFolder),
                      onDismiss = { folderToRename = null },
                      onConfirm = { rawNewName ->
                          val cleanNewName = rawNewName.trim().replace("/", "-")
                          if (cleanNewName.isNotEmpty()) {
                              val parent = parentFolderPath(targetFolder)
                              val newPath = if (parent.isEmpty()) cleanNewName else "$parent/$cleanNewName"
                              // Preserve original folder color upon rename
                              val oldColorMap = loadFolderColorMap(prefs).toMutableMap()
                              val oldColor = oldColorMap[targetFolder.lowercase()]
                              if (oldColor != null) {
                                  oldColorMap[newPath.lowercase()] = oldColor
                                  saveFolderColorMap(prefs, oldColorMap)
                              }

                              val updatedFolders = customFolders.map { existing ->
                                  if (existing.equals(targetFolder, ignoreCase = true)) {
                                      newPath
                                  } else if (existing.startsWith("$targetFolder/", ignoreCase = true)) {
                                      newPath + existing.substring(targetFolder.length)
                                  } else {
                                      existing
                                  }
                              }
                              customFolders = expandAllFolderPathsPreservingOrder(updatedFolders + newPath)
                              saveFoldersList(prefs, customFolders)
                              db.renameFolderTree(targetFolder, newPath)
                              if (currentFolderPath.equals(targetFolder, ignoreCase = true)) {
                                  currentFolderPath = newPath
                              } else if (currentFolderPath.startsWith("$targetFolder/", ignoreCase = true)) {
                                  currentFolderPath = newPath + currentFolderPath.substring(targetFolder.length)
                              }
                              refreshNotes()
                          }
                          folderToRename = null
                      }
                  )
              }

              if (folderToDelete != null) {
                  val targetFolder = folderToDelete!!
                  DeleteFolderDialog(
                      folderName = folderDisplayName(targetFolder),
                      onDismiss = { folderToDelete = null },
                      onConfirmDelete = {
                          val updated = customFolders.filterNot {
                              it.equals(targetFolder, ignoreCase = true) ||
                                  it.startsWith("$targetFolder/", ignoreCase = true)
                          }
                          customFolders = updated
                          saveFoldersList(prefs, updated)
                          db.removeFolderTreeMoveNotesToParent(targetFolder)
                          if (currentFolderPath.equals(targetFolder, ignoreCase = true) ||
                              currentFolderPath.startsWith("$targetFolder/", ignoreCase = true)
                          ) {
                              currentFolderPath = parentFolderPath(targetFolder)
                          }
                          refreshNotes()
                          folderToDelete = null
                      }
                  )
              }

              if (noteToMoveFolder != null) {
                  val target = noteToMoveFolder!!
                  MoveToFolderDialog(
                      currentFolder = target.folder,
                      folders = allFolders,
                      onDismiss = { noteToMoveFolder = null },
                      onSelectFolder = { chosenFolder ->
                          val updated = target.copy(
                              folder = normalizeFolderPath(chosenFolder),
                              updatedAt = System.currentTimeMillis()
                          )
                          db.upsertNote(updated)
                          refreshNotes()
                          noteToMoveFolder = null
                      },
                      onCreateNewFolder = {
                          noteToMoveFolder = null
                          showNewFolderDialog = true
                      }
                  )
              }

              if (noteToRename != null) {
                  val target = noteToRename!!
                  RenameNoteDialog(
                      initialTitle = target.title,
                      onDismiss = { noteToRename = null },
                      onConfirm = { newTitle ->
                          val updated = target.copy(
                              title = newTitle.trim(),
                              updatedAt = System.currentTimeMillis()
                          )
                          db.upsertNote(updated)
                          refreshNotes()
                          noteToRename = null
                      }
                  )
              }

              if (noteToDelete != null) {
                  val target = noteToDelete!!
                  DeleteConfirmationDialog(
                      noteTitle = target.title.ifBlank { "Untitled" },
                      onDismiss = { noteToDelete = null },
                      onConfirmDelete = {
                          val deleting = target
                          noteToDelete = null
                          handleMoveToTrashWithUndo(deleting)
                      }
                  )
              }

              if (showSettingsDialog) {
                  SettingsDialog(
                      isDarkTheme = isDarkTheme,
                      onToggleDarkTheme = onToggleDarkTheme,
                      fontScaleIndex = fontScaleIndex,
                      onSelectFontScale = onSelectFontScale,
                      trashedCount = trashedNotes.size,
                      onOpenTrash = {
                          showSettingsDialog = false
                          refreshNotes()
                          isViewingTrash = true
                      },
                      onDismiss = { showSettingsDialog = false }
                  )
              }
          }

          // ============================================================================
          // RESTYLED HOME SCREEN (MATCHING SPECIFICATION SECTIONS 1–11 EXACTLY)
          // ============================================================================

          @Composable
          fun NotesHomeScreen(
              notes: List<Note>,
              allFolders: List<String>,
              folderColorMap: Map<String, Int>,
              currentFolderPath: String,
              onNavigateFolder: (String) -> Unit,
              onRequestRenameFolder: (String) -> Unit,
              onRequestDeleteFolder: (String) -> Unit,
              searchQuery: String,
              onSearchQueryChange: (String) -> Unit,
              onOpenNote: (Note) -> Unit,
              onCreateNote: () -> Unit,
              onRequestCreateFolder: () -> Unit,
              onTogglePin: (Note) -> Unit,
              onRequestRename: (Note) -> Unit,
              onRequestMoveFolder: (Note) -> Unit,
              onRequestDelete: (Note) -> Unit,
              onOpenSettings: () -> Unit
          ) {
              val palette = LocalFolioPalette.current
              var searchFocused by remember { mutableStateOf(false) }

              // Contextual bottom sheet state for long-pressing a folder tile or note row
              var activeFolderSheetPath by remember { mutableStateOf<String?>(null) }
              var activeNoteSheetItem by remember { mutableStateOf<Note?>(null) }

              BackHandler(enabled = currentFolderPath.isNotEmpty()) {
                  onNavigateFolder(parentFolderPath(currentFolderPath))
              }

              val visibleSubfolders = remember(allFolders, currentFolderPath, searchQuery) {
                  val q = searchQuery.trim().lowercase()
                  if (q.isEmpty()) {
                      directSubfoldersOf(currentFolderPath, allFolders)
                  } else {
                      allFolders.filter { folder ->
                          val inScope = currentFolderPath.isEmpty() ||
                              folder.startsWith("$currentFolderPath/", ignoreCase = true)
                          inScope && folderDisplayName(folder).lowercase().contains(q)
                      }
                  }
              }

              // Sorted by last-modified, newest first, including notes in the current folder scope
              val visibleNotes = remember(notes, currentFolderPath, searchQuery) {
                  val q = searchQuery.trim().lowercase()
                  notes.filter { note ->
                      if (q.isEmpty()) {
                          note.folder.equals(currentFolderPath, ignoreCase = true)
                      } else {
                          val inScope = currentFolderPath.isEmpty() ||
                              note.folder.equals(currentFolderPath, ignoreCase = true) ||
                              note.folder.startsWith("$currentFolderPath/", ignoreCase = true)
                          val matchesText = note.title.lowercase().contains(q) ||
                              note.document.text.lowercase().contains(q)
                          inScope && matchesText
                      }
                  }.sortedByDescending { it.updatedAt }
              }

              BoxWithConstraints(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(palette.screenBg)
              ) {
                  // Exact half-width formula: (screen width - 40 - 12) / 2
                  val tileWidth = ((maxWidth - 40.dp - 12.dp) / 2f).coerceAtLeast(100.dp)

                  // Whole screen scrolls as one list; header is not sticky
                  LazyColumn(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(horizontal = 20.dp),
                      contentPadding = PaddingValues(bottom = 120.dp)
                  ) {
                      // Top padding: system status-bar inset + 16dp
                      item(key = "top_status_spacer") {
                          Spacer(
                              modifier = Modifier
                                  .windowInsetsTopHeight(WindowInsets.statusBars)
                          )
                          Spacer(modifier = Modifier.height(16.dp))
                      }

                      // 3. HEADER ROW (Notes title + 44x44 circle settings button with sliders-horizontal)
                      item(key = "header_row") {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  modifier = Modifier.weight(1f)
                              ) {
                                  if (currentFolderPath.isNotEmpty()) {
                                      val backInteraction = remember { MutableInteractionSource() }
                                      val backPressed by backInteraction.collectIsPressedAsState()
                                      Box(
                                          contentAlignment = Alignment.Center,
                                          modifier = Modifier
                                              .size(44.dp)
                                              .clip(CircleShape)
                                              .alpha(if (backPressed) 0.85f else 1f)
                                              .clickable(
                                                  interactionSource = backInteraction,
                                                  indication = null,
                                                  onClick = { onNavigateFolder(parentFolderPath(currentFolderPath)) }
                                              )
                                      ) {
                                          Icon(
                                              imageVector = Icons.AutoMirrored.Filled.ArrowBack,
                                              contentDescription = "Back",
                                              tint = palette.primaryText,
                                              modifier = Modifier.size(22.dp)
                                          )
                                      }
                                      Spacer(Modifier.width(4.dp))
                                  }

                                  Text(
                                      text = if (currentFolderPath.isEmpty()) "Notes" else folderDisplayName(currentFolderPath),
                                      fontSize = 34.sp,
                                      fontWeight = FontWeight.Bold,
                                      letterSpacing = (-1).sp,
                                      color = palette.primaryText,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }

                              val settingsInteraction = remember { MutableInteractionSource() }
                              val settingsPressed by settingsInteraction.collectIsPressedAsState()
                              Box(
                                  contentAlignment = Alignment.Center,
                                  modifier = Modifier
                                      .size(44.dp)
                                      .clip(CircleShape)
                                      .alpha(if (settingsPressed) 0.85f else 1f)
                                      .background(palette.surface, CircleShape)
                                      .border(1.dp, palette.settingsBorder, CircleShape)
                                      .clickable(
                                          interactionSource = settingsInteraction,
                                          indication = null,
                                          onClick = onOpenSettings
                                      )
                              ) {
                                  LucideSlidersHorizontalIcon(
                                      color = palette.settingsIcon,
                                      size = 22.dp
                                  )
                              }
                          }
                      }

                      // 4. SEARCH BAR (16dp below header, 48dp height, radius 14dp)
                      item(key = "search_bar") {
                          Spacer(Modifier.height(16.dp))

                          val searchBorderMod = when {
                              searchFocused -> Modifier.border(1.5.dp, palette.searchBorderFocused, RoundedCornerShape(14.dp))
                              palette.searchBorderUnfocused != Color.Transparent ->
                                  Modifier.border(1.dp, palette.searchBorderUnfocused, RoundedCornerShape(14.dp))
                              else -> Modifier
                          }

                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(48.dp)
                                  .clip(RoundedCornerShape(14.dp))
                                  .background(palette.searchBg, RoundedCornerShape(14.dp))
                                  .then(searchBorderMod)
                                  .padding(start = 14.dp, end = 14.dp),
                              contentAlignment = Alignment.CenterStart
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  LucideSearchIcon(
                                      color = palette.searchIconAndPlaceholder,
                                      size = 22.dp
                                  )
                                  Spacer(Modifier.width(10.dp))
                                  Box(
                                      modifier = Modifier.weight(1f),
                                      contentAlignment = Alignment.CenterStart
                                  ) {
                                      if (searchQuery.isEmpty()) {
                                          Text(
                                              text = "Search notes and folders",
                                              fontSize = 16.sp,
                                              fontWeight = FontWeight.Normal,
                                              color = palette.searchIconAndPlaceholder,
                                              maxLines = 1,
                                              overflow = TextOverflow.Ellipsis
                                          )
                                      }
                                      BasicTextField(
                                          value = searchQuery,
                                          onValueChange = onSearchQueryChange,
                                          singleLine = true,
                                          textStyle = TextStyle(
                                              fontSize = 16.sp,
                                              fontWeight = FontWeight.Normal,
                                              color = palette.primaryText
                                          ),
                                          cursorBrush = SolidColor(palette.primaryText),
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .onFocusChanged { searchFocused = it.isFocused }
                                      )
                                  }
                                  if (searchQuery.isNotEmpty()) {
                                      Box(
                                          contentAlignment = Alignment.Center,
                                          modifier = Modifier
                                              .size(32.dp)
                                              .clip(CircleShape)
                                              .clickable { onSearchQueryChange("") }
                                      ) {
                                          Icon(
                                              imageVector = Icons.Default.Close,
                                              contentDescription = "Clear search",
                                              tint = palette.searchIconAndPlaceholder,
                                              modifier = Modifier.size(18.dp)
                                          )
                                      }
                                  }
                              }
                          }
                      }

                      // 5. FOLDERS SECTION (22dp below search bar, 44dp tall label row)
                      item(key = "folders_label_row") {
                          Spacer(Modifier.height(22.dp))

                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(44.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  text = "FOLDERS",
                                  fontSize = 13.sp,
                                  fontWeight = FontWeight.SemiBold,
                                  letterSpacing = 0.04.em,
                                  color = palette.secondaryText
                              )

                              val newFolderInteraction = remember { MutableInteractionSource() }
                              val newFolderPressed by newFolderInteraction.collectIsPressedAsState()
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  modifier = Modifier
                                      .height(44.dp)
                                      .clip(RoundedCornerShape(12.dp))
                                      .alpha(if (newFolderPressed) 0.85f else 1f)
                                      .clickable(
                                          interactionSource = newFolderInteraction,
                                          indication = null,
                                          onClick = onRequestCreateFolder
                                      )
                                      .padding(horizontal = 4.dp)
                              ) {
                                  LucidePlusIcon(
                                      color = palette.newFolderAccent,
                                      size = 18.dp
                                  )
                                  Spacer(Modifier.width(6.dp))
                                  Text(
                                      text = "New folder",
                                      fontSize = 15.sp,
                                      fontWeight = FontWeight.SemiBold,
                                      color = palette.newFolderAccent
                                  )
                              }
                          }
                      }

                      // Folder tiles start 2dp below the label row (hidden if there are no folders)
                      if (visibleSubfolders.isNotEmpty()) {
                          item(key = "folders_grid_top_gap") {
                              Spacer(Modifier.height(2.dp))
                          }

                          val folderPairs = visibleSubfolders.chunked(2)
                          items(folderPairs.size, key = { idx -> "folder_pair_$idx" }) { pairIndex ->
                              val rowFolders = folderPairs[pairIndex]
                              if (pairIndex > 0) {
                                  Spacer(Modifier.height(12.dp))
                              }
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.spacedBy(12.dp),
                                  verticalAlignment = Alignment.Top
                              ) {
                                  rowFolders.forEach { folderPath ->
                                      val notesInFolderCount = remember(notes, folderPath) {
                                          notes.count { it.folder.equals(folderPath, ignoreCase = true) }
                                      }
                                      val colorIdx = folderColorMap[folderPath.lowercase()] ?: 0
                                      val colorPair = FolderColorPairs[colorIdx.mod(FolderColorPairs.size)]

                                      FolderGridTile(
                                          folderPath = folderPath,
                                          noteCount = notesInFolderCount,
                                          colorPair = colorPair,
                                          tileWidth = tileWidth,
                                          onClick = {
                                              onSearchQueryChange("")
                                              onNavigateFolder(folderPath)
                                          },
                                          onLongClick = { activeFolderSheetPath = folderPath }
                                      )
                                  }
                              }
                          }
                      }

                      // 6. NOTES SECTION (24dp below folder grid, label "RECENT", 10dp below label is ONE single card)
                      item(key = "recent_notes_section") {
                          Spacer(Modifier.height(24.dp))

                          Text(
                              text = "RECENT",
                              fontSize = 13.sp,
                              fontWeight = FontWeight.SemiBold,
                              letterSpacing = 0.04.em,
                              color = palette.secondaryText
                          )

                          Spacer(Modifier.height(10.dp))

                          // ONE single card holding all rows
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(20.dp))
                                  .background(palette.surface, RoundedCornerShape(20.dp))
                                  .border(1.dp, palette.cardBorder, RoundedCornerShape(20.dp))
                          ) {
                              if (visibleNotes.isEmpty()) {
                                  Box(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(vertical = 32.dp),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Text(
                                          text = "No notes yet",
                                          fontSize = 15.sp,
                                          fontWeight = FontWeight.Normal,
                                          color = palette.secondaryText
                                      )
                                  }
                              } else {
                                  visibleNotes.forEachIndexed { idx, note ->
                                      NoteCardRowItem(
                                          note = note,
                                          onClick = { onOpenNote(note) },
                                          onLongClick = { activeNoteSheetItem = note }
                                      )
                                      if (idx < visibleNotes.lastIndex) {
                                          HorizontalDivider(
                                              modifier = Modifier.fillMaxWidth(),
                                              thickness = 1.dp,
                                              color = palette.rowDivider
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }

                  // 8. "NEW NOTE" PILL BUTTON (Fixed bottom-right: 20dp right, 32dp + nav inset bottom)
                  val fabInteraction = remember { MutableInteractionSource() }
                  val fabPressed by fabInteraction.collectIsPressedAsState()

                  Box(
                      modifier = Modifier
                          .align(Alignment.BottomEnd)
                          .windowInsetsPadding(WindowInsets.navigationBars)
                          .padding(end = 20.dp, bottom = 32.dp)
                  ) {
                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          modifier = Modifier
                              .height(56.dp)
                              .drawBehind {
                                  drawIntoCanvas { canvas ->
                                      val paint = Paint()
                                      val frameworkPaint = paint.asFrameworkPaint()
                                      frameworkPaint.color = Color.Transparent.toArgb()
                                      frameworkPaint.setShadowLayer(
                                          palette.newNoteShadowBlurDp.toPx(),
                                          0f,
                                          8.dp.toPx(),
                                          palette.newNoteShadowColor.toArgb()
                                      )
                                      canvas.drawRoundRect(
                                          0f,
                                          0f,
                                          size.width,
                                          size.height,
                                          28.dp.toPx(),
                                          28.dp.toPx(),
                                          paint
                                      )
                                  }
                              }
                              .clip(RoundedCornerShape(28.dp))
                              .alpha(if (fabPressed) 0.85f else 1f)
                              .background(palette.newNoteBg, RoundedCornerShape(28.dp))
                              .clickable(
                                  interactionSource = fabInteraction,
                                  indication = null,
                                  onClickLabel = "New note",
                                  onClick = onCreateNote
                              )
                              .padding(start = 18.dp, end = 22.dp, top = 0.dp, bottom = 0.dp)
                      ) {
                          LucidePlusIcon(
                              color = palette.newNoteContent,
                              size = 22.dp
                          )
                          Spacer(Modifier.width(8.dp))
                          Text(
                              text = "New note",
                              fontSize = 16.sp,
                              fontWeight = FontWeight.SemiBold,
                              color = palette.newNoteContent
                          )
                      }
                  }
              }

              // Long-Press Bottom Sheet for Folder Tile Actions
              if (activeFolderSheetPath != null) {
                  val targetPath = activeFolderSheetPath!!
                  ModalBottomSheet(
                      onDismissRequest = { activeFolderSheetPath = null },
                      shape = RoundedCornerShape(topStart = 22.dp, topEnd = 22.dp),
                      containerColor = palette.surface
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 20.dp, vertical = 8.dp)
                              .windowInsetsPadding(WindowInsets.navigationBars)
                      ) {
                          Text(
                              text = folderDisplayName(targetPath),
                              fontSize = 17.sp,
                              fontWeight = FontWeight.SemiBold,
                              color = palette.primaryText,
                              modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp)
                          )
                          SheetActionRow(
                              label = "Rename folder",
                              icon = Icons.Default.Edit,
                              textColor = palette.primaryText,
                              onClick = {
                                  activeFolderSheetPath = null
                                  onRequestRenameFolder(targetPath)
                              }
                          )
                          SheetActionRow(
                              label = "Delete folder",
                              icon = Icons.Default.Delete,
                              textColor = MaterialTheme.colorScheme.error,
                              onClick = {
                                  activeFolderSheetPath = null
                                  onRequestDeleteFolder(targetPath)
                              }
                          )
                          Spacer(Modifier.height(16.dp))
                      }
                  }
              }

              // Long-Press Bottom Sheet for Note Row Actions
              if (activeNoteSheetItem != null) {
                  val targetNote = activeNoteSheetItem!!
                  ModalBottomSheet(
                      onDismissRequest = { activeNoteSheetItem = null },
                      shape = RoundedCornerShape(topStart = 22.dp, topEnd = 22.dp),
                      containerColor = palette.surface
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 20.dp, vertical = 8.dp)
                              .windowInsetsPadding(WindowInsets.navigationBars)
                      ) {
                          Text(
                              text = targetNote.title.ifBlank { "Untitled" },
                              fontSize = 17.sp,
                              fontWeight = FontWeight.SemiBold,
                              color = palette.primaryText,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                              modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp)
                          )
                          SheetActionRow(
                              label = if (targetNote.isPinned) "Unpin" else "Pin",
                              icon = Icons.Outlined.PushPin,
                              textColor = palette.primaryText,
                              onClick = {
                                  activeNoteSheetItem = null
                                  onTogglePin(targetNote)
                              }
                          )
                          SheetActionRow(
                              label = "Rename",
                              icon = Icons.Default.Edit,
                              textColor = palette.primaryText,
                              onClick = {
                                  activeNoteSheetItem = null
                                  onRequestRename(targetNote)
                              }
                          )
                          SheetActionRow(
                              label = "Move to folder",
                              icon = Icons.Outlined.Folder,
                              textColor = palette.primaryText,
                              onClick = {
                                  activeNoteSheetItem = null
                                  onRequestMoveFolder(targetNote)
                              }
                          )
                          SheetActionRow(
                              label = "Move to Trash",
                              icon = Icons.Default.Delete,
                              textColor = MaterialTheme.colorScheme.error,
                              onClick = {
                                  activeNoteSheetItem = null
                                  onRequestDelete(targetNote)
                              }
                          )
                          Spacer(Modifier.height(16.dp))
                      }
                  }
              }
          }

          @Composable
          fun SheetActionRow(
              label: String,
              icon: ImageVector,
              textColor: Color,
              onClick: () -> Unit
          ) {
              val palette = LocalFolioPalette.current
              val interaction = remember { MutableInteractionSource() }
              val pressed by interaction.collectIsPressedAsState()

              Row(
                  verticalAlignment = Alignment.CenterVertically,
                  modifier = Modifier
                      .fillMaxWidth()
                      .heightIn(min = 48.dp)
                      .clip(RoundedCornerShape(12.dp))
                      .background(if (pressed) palette.pressedRowBg else Color.Transparent)
                      .clickable(
                          interactionSource = interaction,
                          indication = null,
                          onClick = onClick
                      )
                      .padding(horizontal = 12.dp, vertical = 12.dp)
              ) {
                  Icon(
                      imageVector = icon,
                      contentDescription = null,
                      tint = textColor,
                      modifier = Modifier.size(20.dp)
                  )
                  Spacer(Modifier.width(12.dp))
                  Text(
                      text = label,
                      fontSize = 16.sp,
