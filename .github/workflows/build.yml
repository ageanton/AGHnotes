                                      if ((cL.startsWith("☐ ") || cL.startsWith("☑ ")) && tO <= ls+2) { val tP = if(cL.startsWith("☐ ")) "☑ " else "☐ "; val nT = inc.text.substring(0, ls) + tP + cL.substring(2); val nD = d.copy(text = nT); val nS = TextRange(min(ls+2, nT.length)); d = nD; tfv = TextFieldValue(nT, nS); tIS(nD, selection=nS, forceNewUndoStep=true); return@BasicTextField }
