                  val eL = if (cL.startsWith("• ") || cL.startsWith("☐ ") || cL.startsWith("☑ ")) 2 else 0
                  val rep = if ((tP == "☐ " && (cL.startsWith("☐ ") || cL.startsWith("☑ "))) || cL.startsWith(tP)) cL.substring(eL) else tP + cL.substring(eL)
                  val nT = r.substring(0, ls) + rep + r.substring(le); val nS = TextRange((cur + rep.length - cL.length).coerceIn(ls, ls + rep.length))
