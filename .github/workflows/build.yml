name: Build Monolith Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Configs & Adaptive Vector Icon
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FolioNotes"
          include(":app")
          EOF

          printf "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n" > gradle.properties

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' | sed 's/^          //' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#191918"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FAF9F5"
                  android:pathData="M31,24h36l10,10v50c0,2.2 -1.8,4 -4,4H31c-2.2,0 -4,-1.8 -4,-4V28c0,-2.2 1.8,-4 4,-4z"/>
              <path
                  android:fillColor="#E6E4DD"
                  android:pathData="M67,24v10h10z"/>
              <path
                  android:fillColor="#191918"
                  android:pathData="M36,42h24v3.2h-24zM36,51h18v3.2h-18z"/>
              <path
                  android:fillColor="#2563EB"
                  android:pathData="M36,68 C42,61 48,73 56,64 C60,60 64,62 68,58 L70,61 C65,65 61,64 57,68 C48,77 42,65 36,72 Z"/>
              <path
                  android:fillColor="#D97706"
                  android:pathData="M62,56 L77,41 L82,46 L67,61 Z"/>
              <path
                  android:fillColor="#191918"
                  android:pathData="M59,64 L62,56 L67,61 Z"/>
          </vector>
          EOF

      - name: Ensure Valid Persistent Release Keystore
        run: |
          mkdir -p app
          if ! keytool -list -keystore app/keystore.jks -storepass monolithPass2026 -alias monolith_key >/dev/null 2>&1; then
            echo "Generating clean PKCS12 release keystore..."
            rm -f app/keystore.jks
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore app/keystore.jks \
              -alias monolith_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass monolithPass2026 \
              -keypass monolithPass2026 \
              -dname "CN=MonolithVault, OU=Mobile, O=MonolithLocal, L=Local, S=Local, C=IN"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/keystore.jks
            git commit -m "chore: persist valid PKCS12 android release keystore [skip ci]" || true
            git push || true
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK & Play Store Bundle
        run: |
          gradle assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk Folio-Notes-Release.apk
          cp app/build/outputs/bundle/release/app-release.aab Folio-Notes-PlayStore.aab

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Notes-Android-Release
          path: |
            Folio-Notes-Release.apk
            Folio-Notes-PlayStore.aab
